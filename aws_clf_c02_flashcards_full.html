<script>
const allCards = [{"page": 1, "term": "クラウドコンピューティング", "answer": "サーバーやストレージなどのITリソースを、自社で所有せずインターネット経由でオンデマンドに利用する仕組み。", "section": "1. クラウドコンピューティング", "tip": "「所有せず、必要なときに借りる」。オンデマンド利用がキーワード。"}, {"page": 1, "term": "IaaS（Infrastructure as aService）", "answer": "サーバー・ストレージ・ネットワークなど「インフラ」を提供。OS以上は利用者が管理する（例：EC2）。", "section": "1. クラウドコンピューティング", "tip": "I＝Infrastructure。インフラを借り、OS以上は自分で管理。"}, {"page": 1, "term": "PaaS（Platform as a Service）", "answer": "OSやミドルウェアまで提供され、利用者はアプリのコードだけに集中できる（例：Elastic Beanstalk）。", "section": "1. クラウドコンピューティング", "tip": "P＝Platform。OS・ミドルウェアまで任せて、コードに集中。"}, {"page": 1, "term": "SaaS（Software as a Service）", "answer": "完成したソフトウェアそのものを提供。利用者はインフラもコードも意識せず使うだけ（例：Gmail、Amazon Chime）。", "section": "1. クラウドコンピューティング", "tip": "S＝Software。完成品をそのまま使う。管理範囲が最小。"}, {"page": 1, "term": "パブリッククラウド", "answer": "AWSのように、不特定多数の顧客が共有するクラウド環境。初期費用を抑えやすい。", "section": "1. クラウドコンピューティング", "tip": "「みんなで使う」。AWSのような一般向けクラウド。"}, {"page": 1, "term": "プライベートクラウド", "answer": "自社専用に構築されたクラウド環境（オンプレミス含む）。セキュリティ要件が厳しい場合に選ばれる。", "section": "1. クラウドコンピューティング", "tip": "「自社専用」。専用環境・厳しい要件をイメージ。"}, {"page": 1, "term": "ハイブリッドクラウド", "answer": "オンプレミス（プライベート）とパブリッククラウドを組み合わせて運用する形態。AWS Outposts等が該当。", "section": "1. クラウドコンピューティング", "tip": "Hybrid＝混ぜる。オンプレミス＋パブリッククラウド。"}, {"page": 1, "term": "固定費が変動費に変わる", "answer": "データセンター等への先行投資が不要になり、使った分だけの支払いになる。", "section": "1. クラウドコンピューティング", "tip": "この用語は「何をするものか」を1文で言えるようにしてから、似た用語との違いをセットで覚える。"}, {"page": 1, "term": "スケールメリットによる大きなコスト削減", "answer": "多数の顧客の利用を集約することで、AWSはより低いコストを実現し利用者に還元する。", "section": "1. クラウドコンピューティング", "tip": "この用語は「何をするものか」を1文で言えるようにしてから、似た用語との違いをセットで覚える。"}, {"page": 1, "term": "キャパシティ予測が不要になる", "answer": "将来の需要を予測して機材を用意する必要がなくなり、必要な時に必要なだけ調達できる。", "section": "1. クラウドコンピューティング", "tip": "この用語は「何をするものか」を1文で言えるようにしてから、似た用語との違いをセットで覚える。"}, {"page": 1, "term": "速度と俊敏性の向上", "answer": "新しいITリソースを数分で調達でき、開発・実験のスピードが上がる。", "section": "1. クラウドコンピューティング", "tip": "この用語は「何をするものか」を1文で言えるようにしてから、似た用語との違いをセットで覚える。"}, {"page": 1, "term": "データセンターの運用・保守への支出が不要", "answer": "ラックの設置や配線などの「重い作業」をAWSに任せ、本来のビジネスに集中できる。", "section": "1. クラウドコンピューティング", "tip": "この用語は「何をするものか」を1文で言えるようにしてから、似た用語との違いをセットで覚える。"}, {"page": 1, "term": "わずか数分で世界中にデプロイ", "answer": "世界中のリージョンを使い、低レイテンシで多拠点にアプリケーションを展開できる。", "section": "1. クラウドコンピューティング", "tip": "この用語は「何をするものか」を1文で言えるようにしてから、似た用語との違いをセットで覚える。"}, {"page": 2, "term": "スケーラビリティ（拡張性）", "answer": "需要の増加に応じて、システムの処理能力を大きくしていける性質（長期的な成長への対応）。", "section": "2. コンピューティング", "tip": "Scale＝大きさ。需要が増えたときに「大きくできる力」。"}, {"page": 2, "term": "イラスティシティ（弾力性）", "answer": "需要の増減に応じて、リソースを自動的に増減させる性質（AutoScalingが代表例、短期的な変動への対応）。", "section": "2. コンピューティング", "tip": "Elastic＝ゴム。需要に合わせて「伸び縮み」する力。"}, {"page": 2, "term": "高可用性（High Availability）", "answer": "複数のAZなどにシステムを分散し、障害が起きてもサービスを継続提供できるようにする設計思想。", "section": "2. コンピューティング", "tip": "「止まりにくくする」。複数AZなどへ分散して継続提供。"}, {"page": 2, "term": "耐障害性（Fault Tolerance）", "answer": "一部のコンポーネントが故障しても、性能を落とさず動き続けられる能力（高可用性よりさらに一段階上）。", "section": "2. コンピューティング", "tip": "Fault＝故障してもTolerate＝耐える。故障しても性能低下を抑えて動き続ける。"}, {"page": 2, "term": "RTO（目標復旧時間）", "answer": "障害発生からシステムを復旧させるまでに許容できる「時間」の目標値。", "section": "2. コンピューティング", "tip": "T＝Time。「何分・何時間で戻す？」→ 時間の目標。"}, {"page": 2, "term": "RPO（目標復旧時点）", "answer": "障害発生時に、どの時点のデータまで復旧できればよいかを示す「データ損失許容量」の目標値。", "section": "2. コンピューティング", "tip": "P＝Point。「どこまで戻す？」→ データ時点の目標。"}, {"page": 2, "term": "インスタンス", "answer": "AMIをもとに起動される、実際に稼働する仮想サーバーの実体（EC2の「1台」を指す単位）。", "section": "2. コンピューティング", "tip": "AMIという設計図から作った「実物の1台」。"}, {"page": 2, "term": "Amazon Machine Image (AMI)", "answer": "OS・設定・アプリ等を含む、EC2インスタンスを起動するための「テンプレート（ひな形）」。同じAMIから何台でも同じ構成のインスタンスを作れる。", "section": "2. コンピューティング", "tip": "AMI＝設計図。ここから同じ構成のEC2を何台でも作る。"}, {"page": 2, "term": "インスタンスファミリー", "answer": "EC2インスタンスタイプの分類。用途に応じて「汎用（M系）」「コンピューティング最適化（C系）」「メモリ最適化（R系）」「ストレージ最適化（I/D系）」「高速コンピューティング（P/G系、GPU等）」に分かれる。", "section": "2. コンピューティング", "tip": "M/C/R/I-D/P-Gを用途別の「車種」と覚える。"}, {"page": 2, "term": "Amazon EC2", "answer": "仮想サーバーをオンデマンドで起動できるIaaS。OS以上を自由に管理できる最も基本的なコンピューティングサービス。", "section": "2. コンピューティング", "tip": "Elastic Compute Cloud。自由度の高い仮想サーバー。"}, {"page": 2, "term": "AWS Lambda", "answer": "サーバー管理不要でコードを実行できるサーバーレスコンピューティング。イベント駆動でリクエスト時のみ課金。", "section": "2. コンピューティング", "tip": "「サーバーを意識せず、関数を実行」。イベント駆動・実行時課金。"}, {"page": 2, "term": "AWS Elastic Beanstalk", "answer": "コードをアップロードするだけで、EC2・ELB・AutoScalingなどの環境構築を自動化するPaaS的サービス。", "section": "2. コンピューティング", "tip": "「コードを置けば環境を用意」。EC2等の構築をまとめて自動化。"}, {"page": 2, "term": "Amazon Lightsail", "answer": "仮想サーバー・ストレージ・DNSなどが定額パッケージになった、シンプルなVPS型サービス。小規模サイト向け。", "section": "2. コンピューティング", "tip": "「ライト＝簡単」。定額・シンプルなVPS。"}, {"page": 3, "term": "AWS Batch", "answer": "大量のバッチ計算ジョブを、必要なコンピューティングリソースを自動調達して実行するサービス。", "section": "2. コンピューティング", "tip": "Batch＝まとめて処理。大量のバッチジョブを自動実行。"}, {"page": 3, "term": "AWS Outposts", "answer": "AWSのインフラ・サービスをオンプレミス環境に設置できるハードウェア。データを自社内に置く必要がある場合に使う。", "section": "2. コンピューティング", "tip": "「AWSを自社内へ」。オンプレミスにAWSインフラを置く。"}, {"page": 3, "term": "Amazon ECS", "answer": "AWS独自のコンテナオーケストレーションサービス（Amazon Elastic ContainerService）。Dockerコンテナの実行・管理を行う。", "section": "2. コンピューティング", "tip": "ECS＝AWS独自のコンテナ管理。"}, {"page": 3, "term": "Amazon EKS", "answer": "Kubernetes（K8s）互換のマネージドコンテナオーケストレーションサービス。", "section": "2. コンピューティング", "tip": "KubernetesのK＝EKS。Kubernetes互換のコンテナ管理。"}, {"page": 3, "term": "AWS Fargate", "answer": "ECSやEKSの実行基盤となる、サーバーレスのコンテナ実行エンジン。EC2インスタンスの管理が不要になる。", "section": "2. コンピューティング", "tip": "「サーバーを消してコンテナだけ」。ECS/EKSのサーバーレス実行基盤。"}, {"page": 3, "term": "Amazon ECR", "answer": "Dockerコンテナイメージを保存・管理するプライベートリポジトリ。", "section": "2. コンピューティング", "tip": "Registry＝置き場。コンテナイメージの保管場所。"}, {"page": 3, "term": "EC2 Auto Scaling", "answer": "需要の増減に応じて、EC2インスタンスの数を自動的に増減させるサービス。最小・最大・希望のインスタンス数を設定して使う。", "section": "2. コンピューティング", "tip": "Auto＝自動、Scaling＝台数を増減。ELBは振り分け、ASは台数。"}, {"page": 3, "term": "Amazon S3", "answer": "インターネット経由でアクセスするオブジェクトストレージ。容量無制限で耐久性が高い。写真・動画・バックアップ等に利用。", "section": "2. コンピューティング", "tip": "S＝Simple、3は覚え方として「オブジェクトの置き場」。写真・動画・バックアップ。"}, {"page": 3, "term": "Amazon EBS", "answer": "EC2にアタッチするブロックストレージ（仮想ハードディスク）。1つのEC2インスタンスに直結して使う。", "section": "2. コンピューティング", "tip": "Block＝ブロック。EC2の「仮想ハードディスク」。"}, {"page": 3, "term": "Amazon EFS", "answer": "複数のEC2から同時にマウントできるマネージドのネットワークファイルシステム（NFS）。", "section": "2. コンピューティング", "tip": "File＝ファイル。複数EC2から共有、NFS。"}, {"page": 3, "term": "Amazon FSx", "answer": "Windows File Server や Lustreなど、特定用途に最適化されたマネージドファイルストレージ。", "section": "2. コンピューティング", "tip": "特定用途のファイルシステム。WindowsならSMBを連想。"}, {"page": 4, "term": "AWS Storage Gateway", "answer": "オンプレミス環境とS3などのAWSストレージをシームレスに接続するハイブリッドストレージサービス。", "section": "3. ストレージ", "tip": "「オンプレとAWSストレージの橋渡し」。"}, {"page": 4, "term": "S3 Standard", "answer": "高頻度アクセス向けの標準クラス。可用性・耐久性が高く、汎用的な用途に使う。", "section": "3. ストレージ", "tip": "「よく使う＝Standard」。"}, {"page": 4, "term": "S3 Intelligent-Tiering", "answer": "アクセス頻度を自動で監視し、最適なコストのクラスへ自動的にデータを移動する。アクセスパターンが読めない場合に最適。", "section": "3. ストレージ", "tip": "アクセス頻度を「自動で見て」最適クラスへ。"}, {"page": 4, "term": "S3 Standard-IA", "answer": "低頻度アクセス向け。取り出しは高速だが、Standardより保存コストが安く取り出し費用がかかる（最低保存期間30日）。", "section": "3. ストレージ", "tip": "IA＝Infrequent Access。「たまに使う」。"}, {"page": 4, "term": "S3 One Zone-IA", "answer": "単一のアベイラビリティーゾーン（AZ）にのみ保存する低頻度アクセス向けクラス。Standard-IAよりさらに安価だが可用性は低い。", "section": "3. ストレージ", "tip": "One Zone＝1つのAZ。安いが可用性は低め。"}, {"page": 4, "term": "S3 Glacier Instant Retrieval", "answer": "アーカイブ用途向けだが、取り出しはミリ秒単位で即時に可能な低コストクラス。", "section": "3. ストレージ", "tip": "GlacierだがInstant＝すぐ取り出せる。"}, {"page": 4, "term": "S3 Glacier Flexible Retrieval", "answer": "数分〜数時間で取り出し可能なアーカイブクラス（旧S3Glacier）。年数回程度のアクセス向け。", "section": "3. ストレージ", "tip": "Flexible＝取り出し時間を許容。数分〜数時間。"}, {"page": 4, "term": "S3 Glacier Deep Archive", "answer": "S3の中で最も低コストなクラス。取り出しには12時間以上かかる。長期保管・法定保存用途向け。", "section": "3. ストレージ", "tip": "Deep Archive＝最深部の長期保管。最安・取り出し遅い。"}, {"page": 4, "term": "AWS Snowcone", "answer": "最も小型のエッジデバイス。数TB程度の少量データの移行や、現地でのデータ収集に使う。", "section": "3. ストレージ", "tip": "Snowシリーズで最小。「cone＝小型」と連想してもよい。"}, {"page": 4, "term": "AWS Snowball", "answer": "数十TB単位の大量データをオフラインで物理輸送して移行する専用ストレージデバイス。", "section": "3. ストレージ", "tip": "Snowball＝箱を物理輸送。数十TB級。"}, {"page": 4, "term": "AWS Snowmobile", "answer": "コンテナトラックで運ぶ超大容量（エクサバイト級）のデータ移行サービス。", "section": "3. ストレージ", "tip": "Mobile＝トラック級。超大容量・エクサバイト級。"}, {"page": 4, "term": "AWS DataSync", "answer": "オンプレミスとAWSストレージ間で、ネットワーク経由でデータを自動的に同期・転送するサービス。", "section": "3. ストレージ", "tip": "Sync＝同期。ネットワーク経由で自動転送。"}, {"page": 4, "term": "AWS Transfer Family", "answer": "FTP／SFTP／FTPSプロトコルを使ってS3やEFSにファイル転送するためのマネージドサービス。", "section": "3. ストレージ", "tip": "FTP/SFTP/FTPSをAWSストレージにつなぐ「転送窓口」。"}, {"page": 5, "term": "NFSプロトコル", "answer": "Linux／Unix系でよく使われるファイル共有プロトコル。AmazonEFSはこのNFSでファイルを共有する。", "section": "3. ストレージ", "tip": "NFS＝Linux/Unix系、EFSとセット。"}, {"page": 5, "term": "SMBプロトコル", "answer": "Windows環境でよく使われるファイル共有プロトコル。Amazon FSx for Windows FileServerはこのSMBに対応する。", "section": "3. ストレージ", "tip": "SMB＝Windows系、FSx for Windowsとセット。"}, {"page": 5, "term": "Amazon FSx for Windows FileServer", "answer": "Windows Serverの機能（ActiveDirectory連携、SMBアクセス）をそのまま使えるマネージドファイルストレージ。", "section": "3. ストレージ", "tip": "Amazonの後ろの固有名詞から用途を連想し、似たサービスとの違いを1つ言えるようにする。"}, {"page": 5, "term": "バージョニング", "answer": "S3バケット内のオブジェクトを上書き・削除しても、過去のバージョンを残しておける機能。誤削除からの復旧に有効。", "section": "3. ストレージ", "tip": "Version＝過去版を残す。「過去に戻せる」。"}, {"page": 5, "term": "ライフサイクル設定", "answer": "オブジェクトの経過日数に応じて、自動的に安価なストレージクラスへ移行したり、削除したりするルールを設定する機能。", "section": "3. ストレージ", "tip": "Lifecycle＝自動で「安くする／消す」。"}, {"page": 5, "term": "ブロックパブリックアクセス", "answer": "バケットやオブジェクトが誤って公開設定にされても、パブリックアクセスを強制的にブロックするセキュリティ機能。", "section": "3. ストレージ", "tip": "「公開事故を防ぐ」安全装置。"}, {"page": 5, "term": "AWS Backup", "answer": "EBS・RDS・DynamoDB・EFSなど複数のAWSサービスのバックアップを一元的に管理・自動化するサービス。", "section": "3. ストレージ", "tip": "複数サービスのバックアップを「まとめて管理」。"}, {"page": 5, "term": "ポイントインタイムリカバリ(PITR)", "answer": "DynamoDBやRDS等で、過去35日以内の任意の時点の状態にデータベースを復元できる継続的バックアップ機能。", "section": "3. ストレージ", "tip": "Point in Time＝「任意の時点に戻る」。RPOと関連づける。"}, {"page": 5, "term": "AWS CloudHSM", "answer": "専用の物理ハードウェア（HSM）上で暗号鍵を管理する、シングルテナントの暗号化サービス。KMSより厳格な鍵管理要件（規制対応等）がある場合に使う。", "section": "3. ストレージ", "tip": "HSM＝専用ハードウェアで鍵を厳格管理。KMSより専用性が高い。"}, {"page": 5, "term": "Amazon RDS", "answer": "MySQL・PostgreSQL・Oracle等、複数エンジンに対応したマネージドリレーショナルデータベース。", "section": "3. ストレージ", "tip": "Relational Database Service＝汎用マネージドSQL DB。"}, {"page": 6, "term": "Amazon Aurora", "answer": "MySQL／PostgreSQL互換で、RDSより高速・高可用性なAWS独自のリレーショナルDB。", "section": "4. データベース", "tip": "「RDSの高性能版」イメージ。MySQL/PostgreSQL互換。"}, {"page": 6, "term": "Amazon DynamoDB", "answer": "キーバリュー／ドキュメント型のフルマネージドNoSQLデータベース。低レイテンシで大規模に拡張可能。", "section": "4. データベース", "tip": "Dynamo＝大規模・低レイテンシのNoSQL。Key-Value/Document。"}, {"page": 6, "term": "Amazon ElastiCache", "answer": "Redis／Memcached互換のインメモリキャッシュサービス。DBの前段に置いて高速化する。", "section": "4. データベース", "tip": "Cache＝DBの前に置く高速化用。データ消失を許容するキャッシュ用途。"}, {"page": 6, "term": "Amazon MemoryDB for Redis", "answer": "Redis互換で、キャッシュとしてだけでなく、それ自体を耐久性のある本番用データベースとしても使えるインメモリデータベース。", "section": "4. データベース", "tip": "MemoryDB＝Redisを「本番DBとしても使える」高耐久インメモリ。"}, {"page": 6, "term": "Amazon Redshift", "answer": "大規模データを対象にしたペタバイト級のデータウェアハウス（分析用DB）。", "section": "4. データベース", "tip": "Red＝大量データ分析。Data Warehouse。"}, {"page": 6, "term": "Amazon DocumentDB", "answer": "MongoDB互換のドキュメント指向データベース（JSON形式）。", "section": "4. データベース", "tip": "Document＝JSON文書、MongoDB互換。"}, {"page": 6, "term": "Amazon Neptune", "answer": "ノードとエッジで表現する関係性データを扱うグラフデータベース。", "section": "4. データベース", "tip": "Neptune＝関係性を「線でつなぐ」Graph DB。"}, {"page": 6, "term": "Amazon Timestream", "answer": "時系列データ（IoTセンサー値など）に特化したデータベース。", "section": "4. データベース", "tip": "Time＝時系列データ。"}, {"page": 6, "term": "Amazon QLDB", "answer": "変更履歴が改ざん不可能な形で記録される台帳（元帳）データベース。", "section": "4. データベース", "tip": "QLDB＝台帳。変更履歴が改ざん不可能。"}, {"page": 6, "term": "Amazon Keyspaces", "answer": "Apache Cassandra互換のマネージドNoSQLデータベース。", "section": "4. データベース", "tip": "Cassandra互換のNoSQL。Keyspaceという名前を連想。"}, {"page": 6, "term": "Amazon VPC", "answer": "AWS上に自分専用の仮想ネットワーク空間を構築するサービス。サブネット・ルートテーブル等で構成する。", "section": "4. データベース", "tip": "Virtual Private Cloud＝自分専用の仮想ネットワーク。"}, {"page": 6, "term": "Amazon Route 53", "answer": "DNS（ドメイン名前解決）サービス。ドメイン登録やヘルスチェック、トラフィックルーティングも行う。", "section": "4. データベース", "tip": "Route＝経路、53＝DNSのポート番号。DNS＋ルーティング。"}, {"page": 6, "term": "Amazon CloudFront", "answer": "コンテンツ配信ネットワーク（CDN）。世界中のエッジロケーションでキャッシュし配信を高速化する。", "section": "4. データベース", "tip": "Front＝ユーザーの近くで配信。CDN・キャッシュ。"}, {"page": 6, "term": "AWS Direct Connect", "answer": "オンプレミスとAWS間を専用線で接続するサービス。安定した帯域と低レイテンシが特徴。", "section": "4. データベース", "tip": "専用線＝DirectにAWSへ接続。"}, {"page": 6, "term": "AWS Site-to-Site VPN", "answer": "オンプレミスとAWS間をインターネット経由で暗号化接続するVPNサービス。", "section": "4. データベース", "tip": "VPN＝インターネット経由の暗号化接続。"}, {"page": 6, "term": "Amazon API Gateway", "answer": "REST／WebSocket APIの作成・公開・管理・スロットリングを行うマネージドサービス。", "section": "4. データベース", "tip": "APIの「入口・門」。APIを公開・管理。"}, {"page": 7, "term": "Elastic Load Balancing (ELB)", "answer": "複数のリソースにトラフィックを自動分散する負荷分散サービス（ALB／NLB／GLB／CLBの総称）。", "section": "5. ネットワーキング", "tip": "Load＝負荷、Balance＝分散。トラフィックを振り分ける。"}, {"page": 7, "term": "AWS Transit Gateway", "answer": "複数のVPCやオンプレミス拠点を1つのハブに接続し、ネットワークを一元管理するサービス。", "section": "5. ネットワーキング", "tip": "Transit＝乗り継ぎ。多数のVPC/拠点をハブで接続。"}, {"page": 7, "term": "AWS Global Accelerator", "answer": "AWSのグローバルネットワークを使い、ユーザーを最も近い・最適なエンドポイントへ振り分けるサービス。", "section": "5. ネットワーキング", "tip": "Accelerator＝入口を最適化。CloudFrontはコンテンツ配信、GAは経路最適化。"}, {"page": 7, "term": "AWS PrivateLink", "answer": "VPCとAWSサービス間をインターネットを経由せずプライベート接続するサービス。", "section": "5. ネットワーキング", "tip": "Private＝インターネットを通さずプライベート接続。"}, {"page": 7, "term": "CIDR", "answer": "IPアドレスの範囲を「10.0.0.0/16」のように表記する方式。VPCやサブネットの大きさ（使えるIPアドレスの数）を決める。", "section": "5. ネットワーキング", "tip": "「10.0.0.0/16」のようにIP範囲を表す。/の数字が大きいほど範囲は小さい。"}, {"page": 7, "term": "サブネット", "answer": "VPCのIPアドレス範囲をさらに分割した、小さなネットワーク区画。AZごとに作成する。", "section": "5. ネットワーキング", "tip": "VPCを「小分け」したネットワーク区画。"}, {"page": 7, "term": "パブリックサブネット", "answer": "インターネットゲートウェイへの経路を持ち、インターネットと直接通信できるサブネット（Webサーバー等を配置）。", "section": "5. ネットワーキング", "tip": "IGWへの経路あり＝インターネットと直接通信可能。"}, {"page": 7, "term": "プライベートサブネット", "answer": "インターネットゲートウェイへの経路を持たず、外部から直接アクセスできないサブネット（DBサーバー等を配置）。", "section": "5. ネットワーキング", "tip": "IGWへの経路なし＝外部から直接アクセス不可。"}, {"page": 7, "term": "セキュリティグループ", "answer": "EC2インスタンス単位に設定する仮想ファイアウォール。許可ルールのみ設定でき、戻りの通信は自動的に許可される（ステートフル）。", "section": "5. ネットワーキング", "tip": "SG＝EC2単位・ステートフル・許可のみ。"}, {"page": 7, "term": "ネットワークACL", "answer": "サブネット単位に設定する仮想ファイアウォール。許可・拒否の両方を設定でき、戻りの通信も明示的に許可が必要（ステートレス）。", "section": "5. ネットワーキング", "tip": "NACL＝サブネット単位・ステートレス・許可/拒否。"}, {"page": 7, "term": "VPCフローログ", "answer": "VPC内のネットワークインターフェースを行き来する通信の情報（送信元・宛先・ポート等）を記録する機能。トラブルシューティングやセキュリティ分析に使う。", "section": "5. ネットワーキング", "tip": "Flow＝通信の流れを記録。トラブルシュートや分析。"}, {"page": 7, "term": "VPCピアリング", "answer": "2つのVPCを1対1で接続し、あたかも同じネットワークであるかのように通信できるようにする機能。", "section": "5. ネットワーキング", "tip": "Peer＝1対1。2つのVPCを直接接続。"}, {"page": 8, "term": "AWS IAM", "answer": "AWSリソースへのアクセスを「誰が」「何を」できるか制御する、ユーザー・ロール・ポリシーの管理サービス。", "section": "5. ネットワーキング", "tip": "IAM＝誰が何をできるか。ユーザー・ロール・ポリシー。"}, {"page": 8, "term": "IAM Identity Center", "answer": "複数のAWSアカウントやアプリケーションへのシングルサインオン（SSO）を提供するサービス。", "section": "5. ネットワーキング", "tip": "複数アカウントへのSSO。『人の入口をまとめる』。"}, {"page": 8, "term": "AWS Organizations", "answer": "複数のAWSアカウントを一元管理し、統合請求やSCP（サービスコントロールポリシー）で権限を制御する。", "section": "5. ネットワーキング", "tip": "複数AWSアカウントを「組織としてまとめる」。SCP・統合請求。"}, {"page": 8, "term": "Amazon Cognito", "answer": "モバイル・Webアプリのエンドユーザー向けに、サインアップ・サインイン・認証機能を提供するサービス。", "section": "5. ネットワーキング", "tip": "アプリの「利用者」のログイン。IAMはAWSリソース側。"}, {"page": 8, "term": "AWS Directory Service", "answer": "Microsoft Active Directoryと連携・互換のディレクトリサービス。", "section": "5. ネットワーキング", "tip": "Directory＝ユーザー/コンピュータのディレクトリ。AD連携。"}, {"page": 8, "term": "AWS KMS", "answer": "暗号化に使う鍵（キー）を作成・管理するサービス。", "section": "5. ネットワーキング", "tip": "Key Management Service＝暗号鍵を管理。"}, {"page": 8, "term": "AWS Secrets Manager", "answer": "DBのパスワードやAPIキーなどの機密情報を安全に保管・自動ローテーションするサービス。", "section": "5. ネットワーキング", "tip": "Secrets＝パスワード/APIキーなどの秘密情報を保管・ローテーション。"}, {"page": 8, "term": "Amazon Macie", "answer": "機械学習でS3内のデータをスキャンし、個人情報(PII)などの機密データを検出するサービス。", "section": "5. ネットワーキング", "tip": "S3の機密データを「見つける」。PII検出。"}, {"page": 8, "term": "Amazon GuardDuty", "answer": "VPCフローログ等を機械学習で分析し、不正アクセスや異常な挙動を検知する脅威検出サービス。", "section": "5. ネットワーキング", "tip": "不審な挙動・脅威を「検知する番犬」。"}, {"page": 8, "term": "Amazon Inspector", "answer": "EC2・コンテナ・Lambdaを自動スキャンし、既知の脆弱性を検出するサービス。", "section": "5. ネットワーキング", "tip": "脆弱性を「検査」。EC2/コンテナ/Lambdaをスキャン。"}, {"page": 8, "term": "AWS WAF", "answer": "Webアプリケーションに対するSQLインジェクション等の攻撃を防ぐファイアウォール。", "section": "5. ネットワーキング", "tip": "Web Application Firewall＝Web攻撃を防ぐ。"}, {"page": 8, "term": "AWS Shield", "answer": "DDoS攻撃からAWSリソースを保護するサービス（Standardは無料で全アカウントに自動適用）。", "section": "5. ネットワーキング", "tip": "DDoSから「盾（Shield）」で守る。"}, {"page": 8, "term": "AWS Firewall Manager", "answer": "複数アカウント・VPCにまたがるWAFやShieldのルールを一元管理するサービス。", "section": "5. ネットワーキング", "tip": "複数アカウントのFirewall/WAF等を一元管理。"}, {"page": 8, "term": "AWS CloudTrail", "answer": "AWSアカウント内のAPI呼び出し履歴（誰が・いつ・何をしたか）を記録する証跡サービス。", "section": "5. ネットワーキング", "tip": "Trail＝足跡。『誰が・いつ・何をしたか』のAPI履歴。"}, {"page": 9, "term": "AWS Config", "answer": "AWSリソースの構成変更履歴を記録し、コンプライアンス違反がないかチェックする。", "section": "6. セキュリティ・認証", "tip": "Config＝構成。リソース設定の変更履歴・コンプライアンス。"}, {"page": 9, "term": "AWS Audit Manager", "answer": "監査対応のための証跡収集を自動化するサービス。", "section": "6. セキュリティ・認証", "tip": "Audit＝監査。監査用証跡を集める。"}, {"page": 9, "term": "AWS Security Hub", "answer": "複数のセキュリティサービス（GuardDuty・Inspector・Macie等）の検出結果を一元的に集約・可視化するダッシュボード。", "section": "6. セキュリティ・認証", "tip": "Securityの「Hub」＝複数の検出結果を一か所に集約。"}, {"page": 9, "term": "AWS Artifact", "answer": "AWSのコンプライアンスレポートや契約書類をオンデマンドで取得できるポータル。", "section": "6. セキュリティ・認証", "tip": "Artifact＝証跡・文書。AWSのコンプライアンス資料を取得。"}, {"page": 9, "term": "AWS Certificate Manager (ACM)", "answer": "Webサイトの暗号化通信(HTTPS)に使うSSL/TLS証明書を、無料で発行・管理・自動更新できるサービス。", "section": "6. セキュリティ・認証", "tip": "Certificate＝証明書。HTTPS用SSL/TLS証明書。"}, {"page": 9, "term": "Amazon Fraud Detector", "answer": "機械学習を使って、オンライン取引などにおける不正・詐欺の兆候を検知するサービス。", "section": "6. セキュリティ・認証", "tip": "Fraud＝詐欺。不正兆候を検知。"}, {"page": 9, "term": "Amazon CloudWatch", "answer": "AWSリソースのメトリクス（CPU使用率等）やログを収集・監視し、アラームを設定できるサービス。", "section": "6. セキュリティ・認証", "tip": "Watch＝監視。メトリクス・ログ・アラーム。"}, {"page": 9, "term": "AWS X-Ray", "answer": "マイクロサービス間を跨ぐリクエストの流れを追跡し、ボトルネックやエラー箇所を可視化する分散トレーシングサービス。", "section": "6. セキュリティ・認証", "tip": "X-Ray＝内部を透視。分散したリクエストの流れを追跡。"}, {"page": 9, "term": "AWS Trusted Advisor", "answer": "コスト・セキュリティ・耐障害性など5つの観点でベストプラクティスをチェックし、改善提案を出す。", "section": "6. セキュリティ・認証", "tip": "Advisor＝助言。ベストプラクティスから改善提案。"}, {"page": 9, "term": "AWS CloudFormation", "answer": "インフラ構成をコード（テンプレート）で定義し、自動的に構築・更新する「IaC」サービス。", "section": "6. セキュリティ・認証", "tip": "Formation＝構築。インフラをコードで作るIaC。"}, {"page": 9, "term": "AWS Control Tower", "answer": "複数アカウント環境（ランディングゾーン）を、ベストプラクティスに沿って自動セットアップ・統制するサービス。", "section": "6. セキュリティ・認証", "tip": "Tower＝全体を見渡す。複数アカウント環境を統制。"}, {"page": 9, "term": "AWS Service Catalog", "answer": "組織内で承認済みのITサービス（テンプレート集）を、利用者がカタログから選んで使えるようにするサービス。", "section": "6. セキュリティ・認証", "tip": "Catalog＝カタログ。承認済みITサービスを選んで利用。"}, {"page": 9, "term": "AWS Compute Optimizer", "answer": "リソースの使用状況をもとに、最適なインスタンスタイプ・サイズを機械学習で提案するサービス。", "section": "6. セキュリティ・認証", "tip": "Optimizer＝最適化。使用状況から適切なサイズ等を提案。"}, {"page": 9, "term": "AWS Health Dashboard", "answer": "AWS全体の障害情報や、自分のアカウントに影響するイベントを通知するダッシュボード。", "section": "6. セキュリティ・認証", "tip": "Health＝AWSの障害・イベント情報。"}, {"page": 10, "term": "AWS Systems Manager", "answer": "EC2やオンプレミスサーバーの運用（パッチ適用、コマンド実行、パラメータ管理等）を一元化するサービス。", "section": "6. セキュリティ・認証", "tip": "サーバー運用を「まとめて管理」。"}, {"page": 10, "term": "セッションマネージャー", "answer": "SSHキーやパスワードなしで、ブラウザ・CLI経由で安全にEC2やオンプレミスサーバーにシェル接続できる機能。", "section": "6. セキュリティ・認証", "tip": "SSHキー/パスワードなしで安全にシェル接続。"}, {"page": 10, "term": "パッチマネージャー", "answer": "OSやソフトウェアのセキュリティパッチ適用を、スケジュールに沿って自動化する機能。", "section": "6. セキュリティ・認証", "tip": "Patch＝OS等の更新を自動化。"}, {"page": 10, "term": "パラメータストア", "answer": "設定値・パスワードなどの文字列データを、階層構造で安全に一元管理できる機能（Secrets Managerより簡易な用途向け）。", "section": "6. セキュリティ・認証", "tip": "設定値・秘密文字列を階層管理。Secrets Managerより簡易用途。"}, {"page": 10, "term": "AWS CloudShell", "answer": "ブラウザから直接使える、AWSCLIがプリインストール済みのマネージド型シェル環境。追加設定なしですぐ使える。", "section": "6. セキュリティ・認証", "tip": "Shell＝ブラウザからCLI。AWS CLIが最初から使える。"}, {"page": 10, "term": "AWS Cloud9", "answer": "ブラウザ上で使えるクラウドベースの統合開発環境（IDE）。コード記述・実行・デバッグができる。", "section": "6. セキュリティ・認証", "tip": "ブラウザ上のIDE。CloudShell＝シェル、Cloud9＝開発環境。"}, {"page": 10, "term": "AWS CodeCommit", "answer": "Gitベースのソースコード管理（バージョン管理）サービス。", "section": "6. セキュリティ・認証", "tip": "Commit＝Gitのコードを保存・管理。"}, {"page": 10, "term": "AWS CodeBuild", "answer": "ソースコードのビルド・テストを自動化するマネージドサービス。", "section": "6. セキュリティ・認証", "tip": "Build＝ビルド・テスト。"}, {"page": 10, "term": "AWS CodeDeploy", "answer": "EC2・Lambda・オンプレミスサーバーへのアプリケーションデプロイを自動化するサービス。", "section": "6. セキュリティ・認証", "tip": "Deploy＝デプロイ。"}, {"page": 10, "term": "AWS CodeArtifact", "answer": "ソフトウェアの依存パッケージ（ライブラリ）を保存・共有できるアーティファクトリポジトリ。", "section": "6. セキュリティ・認証", "tip": "Artifact＝依存パッケージの保管庫。"}, {"page": 10, "term": "AWS Device Farm", "answer": "実機の各種スマートフォン・タブレット上で、アプリの動作テストを自動実行できるサービス。", "section": "6. セキュリティ・認証", "tip": "Device＝実機。スマホ等でアプリをテスト。"}, {"page": 11, "term": "AWS Migration Hub", "answer": "複数の移行ツールの進捗状況を一元的に追跡・可視化するダッシュボード。", "section": "8〜10. 運用・開発・移行・統合", "tip": "MigrationのHub＝移行進捗を一元表示。"}, {"page": 11, "term": "AWS Application DiscoveryService", "answer": "オンプレミス環境のサーバー構成・使用状況を自動的に収集し、移行計画の立案を支援するサービス（移行「前」の現状調査）。", "section": "8〜10. 運用・開発・移行・統合", "tip": "Discovery＝移行前に「現状を発見・調査」。"}, {"page": 11, "term": "AWS Application MigrationService (MGN)", "answer": "サーバー（物理・仮想）をほぼそのままの構成でAWSへリフト＆シフト移行するサービス。", "section": "8〜10. 運用・開発・移行・統合", "tip": "Migration＝サーバーをほぼそのまま移す。リフト＆シフト。"}, {"page": 11, "term": "AWS Database MigrationService (DMS)", "answer": "オンプレミス・他クラウドのデータベースをAWSへ、ダウンタイムを最小限にして移行するサービス。", "section": "8〜10. 運用・開発・移行・統合", "tip": "Database Migration＝DBを移行。"}, {"page": 11, "term": "AWS Schema Conversion Tool(SCT)", "answer": "異なるDBエンジン間（例：Oracle→Aurora）でスキーマを自動変換するツール。DMSと組み合わせて使う。", "section": "8〜10. 運用・開発・移行・統合", "tip": "SchemaをConvert＝異なるDBエンジンのスキーマ変換。"}, {"page": 11, "term": "AWS Elastic Disaster Recovery(DRS)", "answer": "オンプレミスや他クラウドのサーバーを、障害発生時に素早くAWS上で復旧できるようにするディザスタリカバリサービス。", "section": "8〜10. 運用・開発・移行・統合", "tip": "Disaster Recovery＝障害時にAWSへ迅速復旧。"}, {"page": 11, "term": "Amazon SQS", "answer": "メッセージを一時的に保管するキューイングサービス。送信側と受信側の処理を疎結合にする（1対1が基本）。", "section": "8〜10. 運用・開発・移行・統合", "tip": "Queue＝列。メッセージを一時保管して疎結合。1対1が基本。"}, {"page": 11, "term": "Amazon SNS", "answer": "1つのメッセージを複数の購読者（メール・SMS・Lambda等）に同時配信するパブリッシュ／サブスクライブ型サービス。", "section": "8〜10. 運用・開発・移行・統合", "tip": "Notification＝通知。1つを複数購読者へ配信。"}, {"page": 11, "term": "Amazon EventBridge", "answer": "AWSサービスやSaaSからのイベントを検知し、ルールに応じて別のサービスを呼び出すイベントバス。", "section": "8〜10. 運用・開発・移行・統合", "tip": "Event＝出来事を橋渡し。イベントを検知して別サービスを呼ぶ。"}, {"page": 11, "term": "AWS Step Functions", "answer": "複数のAWSサービスを順序立てて実行するワークフローオーケストレーションサービス。", "section": "8〜10. 運用・開発・移行・統合", "tip": "Steps＝手順。複数サービスを順序立てて実行。"}, {"page": 11, "term": "AWS AppConfig", "answer": "アプリケーションの設定値や機能フラグ（FeatureFlag）を、安全に段階的にデプロイ・管理するサービス。", "section": "8〜10. 運用・開発・移行・統合", "tip": "AppのConfig＝設定・Feature Flagを安全に段階配布。"}, {"page": 12, "term": "AWS AppSync", "answer": "GraphQL APIをマネージドで構築・運用できるサービス。リアルタイム更新やオフライン同期に強い。", "section": "8〜10. 運用・開発・移行・統合", "tip": "Sync＝データ同期。GraphQL API、リアルタイム/オフライン同期。"}, {"page": 12, "term": "REST API", "answer": "リソースごとのURLに対しHTTPメソッド（GET／POST等）でアクセスする、最も一般的なWeb API方式。", "section": "8〜10. 運用・開発・移行・統合", "tip": "REST＝リソース＋HTTPメソッド。GET/POSTなど。"}, {"page": 12, "term": "WebSocket API", "answer": "クライアントとサーバー間で双方向・持続的な接続を維持するAPI方式。チャットやリアルタイム通知向け。", "section": "8〜10. 運用・開発・移行・統合", "tip": "Socket＝持続接続。双方向リアルタイム通信。"}, {"page": 12, "term": "GraphQL API", "answer": "必要なデータだけを1回のリクエストでまとめて取得できる、クエリ言語ベースのAPI方式（AppSyncで提供）。", "section": "8〜10. 運用・開発・移行・統合", "tip": "欲しいデータをクエリで指定。「必要なものだけ」。"}, {"page": 12, "term": "Amazon Athena", "answer": "S3上のデータに対してSQLクエリを直接実行できるサーバーレスの分析サービス。", "section": "8〜10. 運用・開発・移行・統合", "tip": "Athena＝S3にSQLを「直接問い合わせ」。"}, {"page": 12, "term": "Amazon EMR", "answer": "Hadoop／Sparkなどのビッグデータ処理フレームワークをクラスタで実行するマネージドサービス。", "section": "8〜10. 運用・開発・移行・統合", "tip": "EMR＝Hadoop/Sparkなどをクラスタで本格処理。"}, {"page": 12, "term": "Amazon Kinesis Data Streams", "answer": "リアルタイムのストリーミングデータを収集・一時保持するKinesisのコア機能。AWSネイティブなストリーミング基盤。", "section": "8〜10. 運用・開発・移行・統合", "tip": "ストリーミングをリアルタイム収集・一時保持。"}, {"page": 12, "term": "Amazon MSK (Managed Streamingfor Apache Kafka)", "answer": "オープンソースのApache Kafkaをフルマネージドで実行できるサービス。", "section": "8〜10. 運用・開発・移行・統合", "tip": "MSK＝Managed Streaming for Kafka。KafkaをAWSでマネージド利用。"}, {"page": 12, "term": "Apache Kafka", "answer": "大量のストリーミングデータをリアルタイムに処理する、業界標準のオープンソース分散メッセージングシステム（AWS以外でも広く使われる技術）。", "section": "8〜10. 運用・開発・移行・統合", "tip": "Kafka＝AWSサービス名ではなく、オープンソースのストリーミング基盤。"}, {"page": 12, "term": "Amazon OpenSearch Service", "answer": "全文検索・ログ分析エンジン（旧Amazon ElasticsearchService）。ベクトル検索にも対応。", "section": "8〜10. 運用・開発・移行・統合", "tip": "Search＝検索・ログ分析。"}, {"page": 12, "term": "Amazon QuickSight", "answer": "データを可視化するBI（ビジネスインテリジェンス）ダッシュボードサービス。", "section": "8〜10. 運用・開発・移行・統合", "tip": "Sight＝見る。データを可視化するBI。"}, {"page": 12, "term": "AWS Glue", "answer": "サーバーレスのETL（抽出・変換・格納）サービス。データカタログ機能も持つ。", "section": "8〜10. 運用・開発・移行・統合", "tip": "Glue＝データを「つなぐ」。ETL・データカタログ。"}, {"page": 12, "term": "AWS Lake Formation", "answer": "S3上にデータレイクを構築し、アクセス権限を一元管理するサービス。", "section": "8〜10. 運用・開発・移行・統合", "tip": "Lake＝データレイクを作り、権限管理。"}, {"page": 12, "term": "AWS Data Exchange", "answer": "サードパーティが提供するデータセットを検索・購読・利用できるデータマーケットプレイス。", "section": "8〜10. 運用・開発・移行・統合", "tip": "Exchange＝外部データを「調達・交換」する場所。"}, {"page": 13, "term": "Amazon Rekognition", "answer": "画像・動画の物体検出、顔検出・顔認証、不適切コンテンツの検出などを行う画像／動画分析サービス。", "section": "12. 機械学習・AI", "tip": "Recognition＝認識。画像・動画を見る。"}, {"page": 13, "term": "Amazon Textract", "answer": "画像やPDFなどの文書から、テキスト・表・フォーム項目を構造化データとして抽出する（OCR＋レイアウト理解）。", "section": "12. 機械学習・AI", "tip": "TextをExtract＝文書から文字・表・フォームを抜き出す。"}, {"page": 13, "term": "Amazon Transcribe", "answer": "音声データをテキストに変換する（Speech to Text）サービス。", "section": "12. 機械学習・AI", "tip": "Transcribe＝音声を文字にする。"}, {"page": 13, "term": "Amazon Polly", "answer": "テキストを自然な音声に変換する（Text to Speech）サービス。", "section": "12. 機械学習・AI", "tip": "Polly＝文字を声にする。Text to Speech。"}, {"page": 13, "term": "Amazon Translate", "answer": "テキストを別の言語へリアルタイムに翻訳する機械翻訳サービス。", "section": "12. 機械学習・AI", "tip": "Translate＝言語を変換。"}, {"page": 13, "term": "Amazon Comprehend", "answer": "自然言語処理(NLP)。感情分析・エンティティ抽出・言語検出など、テキストの「意味」を分析する。", "section": "12. 機械学習・AI", "tip": "Comprehend＝文章の意味を理解・分析。"}, {"page": 13, "term": "Amazon Lex", "answer": "音声／テキストによる会話型インターフェース（チャットボット）を構築するエンジン。Alexaと同じ技術がベース。", "section": "12. 機械学習・AI", "tip": "会話ボットのエンジン。Alexaと同系統の技術。"}, {"page": 13, "term": "Amazon Kendra", "answer": "社内文書やFAQなど大量のドキュメント群を対象に、自然言語の質問で検索できるエンタープライズ検索エンジン。", "section": "12. 機械学習・AI", "tip": "Kendra＝社内文書を自然言語で検索。"}, {"page": 13, "term": "Amazon Bedrock", "answer": "複数社（Anthropic・Meta・Amazon等）の基盤モデル(FM)をAPI経由で利用できるフルマネージドの生成AIサービス。", "section": "12. 機械学習・AI", "tip": "既存の基盤モデルを「選んでAPI利用」。モデル自体を一から学習する場ではない。"}, {"page": 13, "term": "Amazon Q", "answer": "AWS純正の生成AIアシスタント。業務ユーザー向けの「Q Business」、開発者向けの「QDeveloper」等がある。", "section": "12. 機械学習・AI", "tip": "AWSの生成AIアシスタント。「使う」側のサービス。"}, {"page": 14, "term": "Amazon SageMaker", "answer": "機械学習モデルの構築・学習・デプロイ・運用までを行うEnd-to-Endのフルマネージド機械学習基盤。", "section": "12. 機械学習・AI", "tip": "モデルを構築・学習・デプロイ・運用するML基盤。"}, {"page": 14, "term": "Amazon SES (Simple EmailService)", "answer": "大量のメールを送受信するためのマネージドEメール配信サービス。通知メールやマーケティングメール送信に使う。", "section": "12. 機械学習・AI", "tip": "Email＝メール送受信・配信。"}, {"page": 14, "term": "Amazon WorkSpaces", "answer": "クラウド上に仮想デスクトップ（VDI）を提供するサービス。リモートワーク環境の構築等に使う。", "section": "12. 機械学習・AI", "tip": "WorkSpace＝クラウド上の仮想デスクトップ。"}, {"page": 14, "term": "Amazon Connect", "answer": "クラウド型のコンタクトセンター（コールセンター）を構築するサービス。", "section": "12. 機械学習・AI", "tip": "コンタクトセンターの「箱」。"}, {"page": 14, "term": "AWS IoT Core", "answer": "IoTデバイスをAWSに接続し、デバイスとクラウド間の双方向通信・データ収集を行うマネージドサービス。", "section": "12. 機械学習・AI", "tip": "Core＝中心。IoTデバイスとAWSをつなぐハブ。"}, {"page": 14, "term": "AWS IoT Greengrass", "answer": "IoTデバイス側（エッジ）でAWSの機能の一部をローカル実行できるようにするソフトウェア。オフライン時も処理を継続できる。", "section": "12. 機械学習・AI", "tip": "Green＝エッジ側でも動く。オフライン時のローカル処理。"}, {"page": 14, "term": "AWS Pricing Calculator", "answer": "利用前に、構成に応じた料金の見積もりを行うツール。", "section": "12. 機械学習・AI", "tip": "使う「前」に料金を見積もる。"}, {"page": 14, "term": "AWS Cost Explorer", "answer": "過去のコスト・使用状況をグラフで分析・可視化するツール。", "section": "12. 機械学習・AI", "tip": "使った「後」のコストを分析。"}, {"page": 14, "term": "AWS Budgets", "answer": "設定した予算のしきい値を超えそうな場合にアラートを出す機能。", "section": "12. 機械学習・AI", "tip": "予算超過を「防ぐ」ためのアラート。"}, {"page": 14, "term": "AWS Cost and Usage Report(CUR)", "answer": "AWS利用状況とコストの、最も詳細な生データを出力するレポート機能。", "section": "12. 機械学習・AI", "tip": "CUR＝最も詳細な利用・コストの生データ。"}, {"page": 14, "term": "AWS Billing Conductor", "answer": "グループ内の請求を独自のルールで再配分・カスタマイズできる請求管理サービス。", "section": "12. 機械学習・AI", "tip": "請求を独自ルールで再配分・カスタマイズ。"}, {"page": 15, "term": "コスト配分タグ", "answer": "リソースに付与したタグ単位でコストを分類・集計できるようにする機能。部門別・プロジェクト別のコスト管理に使う。", "section": "15. コスト管理・料金", "tip": "タグ＝部門・プロジェクトなどの「切り口」でコスト集計。"}, {"page": 15, "term": "オンデマンド", "answer": "使った分だけ課金される、最も柔軟な標準の料金モデル。初期費用や長期契約なし。", "section": "15. コスト管理・料金", "tip": "自由度最大・長期契約なし。「使った分だけ」。"}, {"page": 15, "term": "リザーブドインスタンス (RI)", "answer": "1年または3年の利用を予約することで、オンデマンドより大幅割引を受けられる料金モデル。", "section": "15. コスト管理・料金", "tip": "1〜3年の予約＝割引。特定インスタンスタイプを予約するイメージ。"}, {"page": 15, "term": "Compute Savings Plans", "answer": "EC2・Fargate・Lambdaを横断して「時間あたりの利用金額」を1〜3年契約することで割引を受けるモデル。最も柔軟。", "section": "15. コスト管理・料金", "tip": "「利用金額」を約束。EC2/Fargate/Lambdaを横断して柔軟。"}, {"page": 15, "term": "EC2 Instance S const searchEl = $("search");

const sections = [...new Set(allCards.map(c => c.section))];
sectionEl.innerHTML = '<option value="">すべての章</option>' + sections.map(s => `<option>${escapeHtml(s)}</option>`).join("");

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}

function rebuild() {
  const q = searchEl.value.trim().toLowerCase();
  const sec = sectionEl.value;
  deck = allCards.filter(c =>
    (!q || (c.term + " " + c.answer + " " + c.tip).toLowerCase().includes(q)) &&
    (!sec || c.section === sec)
  );
  index = 0;
  revealed = false;
  render();
}

function render() {
  $("count").textContent = deck.length;
  if (!deck.length) {
    $("term").textContent = "該当するカードがありません";
    $("hint").textContent = "検索条件を変えてください";
    $("answer").style.display = "none";
    $("meta").textContent = "";
    $("bar").style.width = "0%";
    return;
  }
  const c = deck[index];
  $("meta").textContent = `${index+1} / ${deck.length}　｜　${c.section}　｜　PDF p.${c.page}`;
  $("term").textContent = c.term;
  $("answerText").textContent = c.answer;
  $("tipText").textContent = c.tip;
  $("answer").style.display = revealed ? "block" : "none";
  $("hint").style.display = revealed ? "none" : "block";
  $("bar").style.width = `${((index+1)/deck.length)*100}%`;
}

function move(delta) {
  if (!deck.length) return;
  index = (index + delta + deck.length) % deck.length;
  revealed = false;
  render();
  window.scrollTo({top:0,behavior:"smooth"});
}

$("card").addEventListener("click", () => {
  if (!deck.length) return;
  revealed = !revealed;
  render();
});
$("show").addEventListener("click", () => { revealed = true; render(); });
$("again").addEventListener("click", () => { revealed = false; render(); });
$("known").addEventListener("click", () => {
  if (!deck.length) return;
  known.add(deck[index].term + "|" + deck[index].page);
  move(1);
});
$("prev").addEventListener("click", () => move(-1));
$("next").addEventListener("click", () => move(1));
$("shuffle").addEventListener("click", () => {
  for (let i=deck.length-1;i>0;i--) {
    const j=Math.floor(Math.random()*(i+1));
    [deck[i],deck[j]]=[deck[j],deck[i]];
  }
  index=0; revealed=false; render();
});
$("reset").addEventListener("click", () => { index=0; revealed=false; render(); });
searchEl.addEventListener("input", rebuild);
sectionEl.addEventListener("change", rebuild);

render();
</script>
</body>
</html>
