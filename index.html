<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>AWS CLF-C02 暗記帳</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP", sans-serif;
    background: #f3f4f6;
    color: #111827;
    display: flex;
    justify-content: center;
  }
  .app {
    width: 100%;
    max-width: 560px;
    min-height: 100vh;
    padding: 20px 16px 28px;
    display: flex;
    flex-direction: column;
  }
  header { text-align: center; margin-bottom: 16px; }
  h1 { font-size: 22px; margin: 4px 0 6px; }
  .subtitle { color: #6b7280; font-size: 13px; }
  .progress {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 8px 2px 10px;
    font-size: 13px;
    color: #6b7280;
  }
  .bar {
    height: 7px;
    background: #e5e7eb;
    border-radius: 999px;
    overflow: hidden;
    margin-bottom: 16px;
  }
  .bar > div {
    height: 100%;
    width: 10%;
    background: #111827;
    transition: width .2s ease;
  }
  .card {
    background: white;
    border-radius: 20px;
    min-height: 330px;
    padding: 30px 24px;
    box-shadow: 0 8px 28px rgba(0,0,0,.08);
    display: flex;
    flex-direction: column;
    justify-content: center;
    text-align: center;
    cursor: pointer;
    user-select: none;
  }
  .label {
    font-size: 12px;
    color: #6b7280;
    margin-bottom: 18px;
    letter-spacing: .08em;
  }
  .question {
    font-size: 26px;
    font-weight: 700;
    line-height: 1.5;
    margin-bottom: 24px;
  }
  .answer {
    display: none;
    border-top: 1px solid #e5e7eb;
    padding-top: 22px;
    font-size: 18px;
    line-height: 1.75;
    text-align: left;
  }
  .card.show .answer { display: block; }
  .card.show .hint { display: none; }
  .hint {
    display: inline-block;
    color: #6b7280;
    font-size: 14px;
    margin-top: auto;
  }
  .buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 16px;
  }
  button {
    border: 0;
    border-radius: 14px;
    padding: 15px 12px;
    font-size: 15px;
    font-weight: 600;
    background: white;
    color: #111827;
    box-shadow: 0 3px 12px rgba(0,0,0,.07);
    cursor: pointer;
  }
  button:active { transform: scale(.98); }
  .primary { background: #111827; color: white; }
  .secondary { background: #e5e7eb; }
  .footer {
    text-align: center;
    margin-top: 16px;
    color: #9ca3af;
    font-size: 12px;
  }
  @media (max-height: 650px) {
    .card { min-height: 270px; padding: 24px 20px; }
    .question { font-size: 22px; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>☁️ AWS CLF-C02 暗記帳</h1>
    <div class="subtitle">タップして答えを確認</div>
  </header>

  <div class="progress">
    <span id="count">1 / 10</span>
    <span id="status">問題</span>
  </div>
  <div class="bar"><div id="bar"></div></div>

  <main class="card" id="card" onclick="toggleAnswer()">
    <div class="label">QUESTION</div>
    <div class="question" id="question"></div>
    <div class="answer" id="answer"></div>
    <div class="hint">👆 タップして答えを見る</div>
  </main>

  <div class="buttons">
    <button class="secondary" onclick="prev(event)">← 前へ</button>
    <button class="primary" onclick="next(event)">次へ →</button>
  </div>
  <div class="buttons">
    <button onclick="shuffleCards(event)">🔀 シャッフル</button>
    <button onclick="resetCards(event)">↺ 最初から</button>
  </div>

  <div class="footer">AWS CLF-C02 暗記カード① / 10枚</div>
</div>

<script>
const originalCards = [
  ["IaaSとは？", "インフラを提供。OS以上は利用者が管理（例：EC2）。"],
  ["PaaSとは？", "OS・ミドルウェアまで提供。利用者はコードに集中（例：Elastic Beanstalk）。"],
  ["SaaSとは？", "完成したソフトウェアを提供。利用者は基本的に使うだけ。"],
  ["スケーラビリティとは？", "需要の増加に応じて、処理能力を大きくしていける性質。"],
  ["イラスティシティとは？", "需要の増減に応じて、リソースを自動的に増減させる性質。"],
  ["RTOとは？", "障害発生から復旧までに許容できる「時間」の目標値。"],
  ["RPOとは？", "障害時に、どの時点までデータを復旧できればよいかの目標値。"],
  ["AMIとは？", "EC2インスタンスを起動するためのテンプレート（ひな形）。"],
  ["EC2とは？", "仮想サーバーをオンデマンドで起動できるIaaS。OS以上を管理。"],
  ["AWS Lambdaとは？", "サーバー管理不要でコードを実行するサーバーレスサービス。"]
];

let cards = [...originalCards];
let index = 0;

function render() {
  const [q, a] = cards[index];
  document.getElementById("question").textContent = q;
  document.getElementById("answer").textContent = a;
  document.getElementById("count").textContent = `${index + 1} / ${cards.length}`;
  document.getElementById("bar").style.width = `${((index + 1) / cards.length) * 100}%`;
  document.getElementById("card").classList.remove("show");
  window.scrollTo({top: 0, behavior: "smooth"});
}

function toggleAnswer() {
  document.getElementById("card").classList.toggle("show");
}

function next(e) {
  if (e) e.stopPropagation();
  index = (index + 1) % cards.length;
  render();
}

function prev(e) {
  if (e) e.stopPropagation();
  index = (index - 1 + cards.length) % cards.length;
  render();
}

function shuffleCards(e) {
  if (e) e.stopPropagation();
  for (let i = cards.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [cards[i], cards[j]] = [cards[j], cards[i]];
  }
  index = 0;
  render();
}

function resetCards(e) {
  if (e) e.stopPropagation();
  cards = [...originalCards];
  index = 0;
  render();
}

render();
</script>
</body>
</html>
