<script>
const ALL=[{"front": "サービス名とは？", "back": "覚えるポイント", "tip": "覚え方：サービス名の「役割」を一言で言えるようにする。PDF p.1 の比較表とセットで覚える。", "page": 1, "section": "AWS認定 クラウドプラクティショナー（CLF-C02）"}, {"front": "クラウドコンピューティングとは？", "back": "サーバーやストレージなどのITリソースを、自社で所有せずインターネット経由でオン デマンドに利用する仕組み。", "tip": "覚え方：クラウドコンピューティングの「役割」を一言で言えるようにする。PDF p.1 の比較表とセットで覚える。", "page": 1, "section": "AWS認定 クラウドプラクティショナー（CLF-C02）"}, {"front": "IaaS（Infrastructure as a Service）とは？", "back": "サーバー・ストレージ・ネットワークなど「インフラ」を提供。OS以上は利用者が管理 する（例：EC2）。", "tip": "覚え方：IaaS（Infrastructure as a Service）の「役割」を一言で言えるようにする。PDF p.1 の比較表とセットで覚える。", "page": 1, "section": "AWS認定 クラウドプラクティショナー（CLF-C02）"}, {"front": "PaaS（Platform as a Service）とは？", "back": "OSやミドルウェアまで提供され、利用者はアプリのコードだけに集中できる（例：Elas tic Beanstalk）。", "tip": "覚え方：PaaS（Platform as a Service）の「役割」を一言で言えるようにする。PDF p.1 の比較表とセットで覚える。", "page": 1, "section": "AWS認定 クラウドプラクティショナー（CLF-C02）"}, {"front": "SaaS（Software as a Service）とは？", "back": "完成したソフトウェアそのものを提供。利用者はインフラもコードも意識せず使うだけ （例：Gmail、Amazon Chime）。", "tip": "覚え方：SaaS（Software as a Service）の「役割」を一言で言えるようにする。PDF p.1 の比較表とセットで覚える。", "page": 1, "section": "AWS認定 クラウドプラクティショナー（CLF-C02）"}, {"front": "パブリッククラウドとは？", "back": "AWSのように、不特定多数の顧客が共有するクラウド環境。初期費用を抑えやすい。", "tip": "覚え方：パブリッククラウドの「役割」を一言で言えるようにする。PDF p.1 の比較表とセットで覚える。", "page": 1, "section": "AWS認定 クラウドプラクティショナー（CLF-C02）"}, {"front": "プライベートクラウドとは？", "back": "自社専用に構築されたクラウド環境（オンプレミス含む）。セキュリティ要件が厳しい 場合に選ばれる。", "tip": "覚え方：プライベートクラウドの「役割」を一言で言えるようにする。PDF p.1 の比較表とセットで覚える。", "page": 1, "section": "AWS認定 クラウドプラクティショナー（CLF-C02）"}, {"front": "ハイブリッドクラウドとは？", "back": "オンプレミス（プライベート）とパブリッククラウドを組み合わせて運用する形態。AW S Outposts等が該当。", "tip": "覚え方：ハイブリッドクラウドの「役割」を一言で言えるようにする。PDF p.1 の比較表とセットで覚える。", "page": 1, "section": "AWS認定 クラウドプラクティショナー（CLF-C02）"}, {"front": "固定費が変動費に変わるとは？", "back": "データセンター等への先行投資が不要になり、使った分だけの支払いになる。", "tip": "覚え方：固定費が変動費に変わるの「役割」を一言で言えるようにする。PDF p.1 の比較表とセットで覚える。", "page": 1, "section": "AWS認定 クラウドプラクティショナー（CLF-C02）"}, {"front": "スケールメリットによる大きな コスト削減とは？", "back": "多数の顧客の利用を集約することで、AWSはより低いコストを実現し利用者に還元する 。", "tip": "覚え方：スケールメリットによる大きな コスト削減の「役割」を一言で言えるようにする。PDF p.1 の比較表とセットで覚える。", "page": 1, "section": "AWS認定 クラウドプラクティショナー（CLF-C02）"}, {"front": "キャパシティ予測が不要になるとは？", "back": "将来の需要を予測して機材を用意する必要がなくなり、必要な時に必要なだけ調達でき る。", "tip": "覚え方：キャパシティ予測が不要になるの「役割」を一言で言えるようにする。PDF p.1 の比較表とセットで覚える。", "page": 1, "section": "AWS認定 クラウドプラクティショナー（CLF-C02）"}, {"front": "速度と俊敏性の向上とは？", "back": "新しいITリソースを数分で調達でき、開発・実験のスピードが上がる。", "tip": "覚え方：速度と俊敏性の向上の「役割」を一言で言えるようにする。PDF p.1 の比較表とセットで覚える。", "page": 1, "section": "AWS認定 クラウドプラクティショナー（CLF-C02）"}, {"front": "データセンターの運用・保守へ の支出が不要とは？", "back": "ラックの設置や配線などの「重い作業」をAWSに任せ、本来のビジネスに集中できる。", "tip": "覚え方：データセンターの運用・保守へ の支出が不要の「役割」を一言で言えるようにする。PDF p.1 の比較表とセットで覚える。", "page": 1, "section": "AWS認定 クラウドプラクティショナー（CLF-C02）"}, {"front": "わずか数分で世界中にデプロイとは？", "back": "世界中のリージョンを使い、低レイテンシで多拠点にアプリケーションを展開できる。", "tip": "覚え方：わずか数分で世界中にデプロイの「役割」を一言で言えるようにする。PDF p.1 の比較表とセットで覚える。", "page": 1, "section": "AWS認定 クラウドプラクティショナー（CLF-C02）"}, {"front": "Service） する（例とは？", "back": "EC2）。", "tip": "覚え方：Service） する（例 → 「何をするものか」を一文で思い出す。PDF p.1 を再確認。", "page": 1, "section": "AWS認定 クラウドプラクティショナー（CLF-C02）"}, {"front": "PaaS（Platform as a Service） OSやミドルウェアまで提供され、利用者はアプリのコードだけに集中できる（例とは？", "back": "Elas", "tip": "覚え方：PaaS（Platform as a Service） OSやミドルウェアまで提供され、利用者はアプリのコードだけに集中できる（例 → 「何をするものか」を一文で思い出す。PDF p.1 を再確認。", "page": 1, "section": "AWS認定 クラウドプラクティショナー（CLF-C02）"}, {"front": "（例とは？", "back": "Gmail、Amazon Chime）。", "tip": "覚え方：（例 → 「何をするものか」を一文で思い出す。PDF p.1 を再確認。", "page": 1, "section": "AWS認定 クラウドプラクティショナー（CLF-C02）"}, {"front": "管理する範囲が狭い順とは？", "back": "SaaS（使うだけ）→PaaS（コードだけ管理）→IaaS（OS以上を管理）", "tip": "覚え方：管理する範囲が狭い順 → 「何をするものか」を一文で思い出す。PDF p.1 を再確認。", "page": 1, "section": "AWS認定 クラウドプラクティショナー（CLF-C02）"}, {"front": "とは？", "back": "オンプレミス（全部自分で管理）", "tip": "覚え方： → 「何をするものか」を一文で思い出す。PDF p.1 を再確認。", "page": 1, "section": "AWS認定 クラウドプラクティショナー（CLF-C02）"}, {"front": "スケーラビリティ（拡張性）とは？", "back": "需要の増加に応じて、システムの処理能力を大きくしていける性質（長期的な成長への 対応）。", "tip": "覚え方：スケーラビリティ（拡張性）の「役割」を一言で言えるようにする。PDF p.2 の比較表とセットで覚える。", "page": 2, "section": "■ 弾力性・拡張性・可用性に関する重要用語"}, {"front": "イラスティシティ（弾力性）とは？", "back": "需要の増減に応じて、リソースを自動的に増減させる性質（Auto Scalingが代表例、短期的な変動への対応）。", "tip": "覚え方：イラスティシティ（弾力性）の「役割」を一言で言えるようにする。PDF p.2 の比較表とセットで覚える。", "page": 2, "section": "■ 弾力性・拡張性・可用性に関する重要用語"}, {"front": "高可用性（High Availability）とは？", "back": "複数のAZなどにシステムを分散し、障害が起きてもサービスを継続提供できるようにす る設計思想。", "tip": "覚え方：高可用性（High Availability）の「役割」を一言で言えるようにする。PDF p.2 の比較表とセットで覚える。", "page": 2, "section": "■ 弾力性・拡張性・可用性に関する重要用語"}, {"front": "耐障害性（Fault Tolerance）とは？", "back": "一部のコンポーネントが故障しても、性能を落とさず動き続けられる能力（高可用性よ りさらに一段階上）。", "tip": "覚え方：耐障害性（Fault Tolerance）の「役割」を一言で言えるようにする。PDF p.2 の比較表とセットで覚える。", "page": 2, "section": "■ 弾力性・拡張性・可用性に関する重要用語"}, {"front": "RTO（目標復旧時間）とは？", "back": "障害発生からシステムを復旧させるまでに許容できる「時間」の目標値。", "tip": "覚え方：RTO（目標復旧時間）の「役割」を一言で言えるようにする。PDF p.2 の比較表とセットで覚える。", "page": 2, "section": "■ 弾力性・拡張性・可用性に関する重要用語"}, {"front": "RPO（目標復旧時点）とは？", "back": "障害発生時に、どの時点のデータまで復旧できればよいかを示す「データ損失許容量」 の目標値。", "tip": "覚え方：RPO（目標復旧時点）の「役割」を一言で言えるようにする。PDF p.2 の比較表とセットで覚える。", "page": 2, "section": "■ 弾力性・拡張性・可用性に関する重要用語"}, {"front": "インスタンスとは？", "back": "AMIをもとに起動される、実際に稼働する仮想サーバーの実体（EC2の「1台」を指す単 位）。", "tip": "覚え方：インスタンスの「役割」を一言で言えるようにする。PDF p.2 の比較表とセットで覚える。", "page": 2, "section": "■ 弾力性・拡張性・可用性に関する重要用語"}, {"front": "Amazon Machine Image (AMI)とは？", "back": "OS・設定・アプリ等を含む、EC2インスタンスを起動するための「テンプレート（ひな 形）」。同じAMIから何台でも同じ構成のインスタンスを作れる。", "tip": "覚え方：Amazon Machine Image (AMI)の「役割」を一言で言えるようにする。PDF p.2 の比較表とセットで覚える。", "page": 2, "section": "■ 弾力性・拡張性・可用性に関する重要用語"}, {"front": "インスタンスファミリーとは？", "back": "EC2インスタンスタイプの分類。用途に応じて「汎用（M系）」「コンピューティング最 適化（C系）」「メモリ最適化（R系）」「ストレージ最適化（I/D系）」「高速コンピ ューティング（P/G系、GPU等）」に分かれる。", "tip": "覚え方：インスタンスファミリーの「役割」を一言で言えるようにする。PDF p.2 の比較表とセットで覚える。", "page": 2, "section": "■ 弾力性・拡張性・可用性に関する重要用語"}, {"front": "Amazon EC2とは？", "back": "仮想サーバーをオンデマンドで起動できるIaaS。OS以上を自由に管理できる最も基本的 なコンピューティングサービス。", "tip": "覚え方：Amazon EC2の「役割」を一言で言えるようにする。PDF p.2 の比較表とセットで覚える。", "page": 2, "section": "■ 弾力性・拡張性・可用性に関する重要用語"}, {"front": "AWS Lambdaとは？", "back": "サーバー管理不要でコードを実行できるサーバーレスコンピューティング。イベント駆 動でリクエスト時のみ課金。", "tip": "覚え方：AWS Lambdaの「役割」を一言で言えるようにする。PDF p.2 の比較表とセットで覚える。", "page": 2, "section": "■ 弾力性・拡張性・可用性に関する重要用語"}, {"front": "AWS Elastic Beanstalkとは？", "back": "コードをアップロードするだけで、EC2・ELB・Auto Scalingなどの環境構築を自動化するPaaS的サービス。", "tip": "覚え方：AWS Elastic Beanstalkの「役割」を一言で言えるようにする。PDF p.2 の比較表とセットで覚える。", "page": 2, "section": "■ 弾力性・拡張性・可用性に関する重要用語"}, {"front": "Amazon Lightsailとは？", "back": "仮想サーバー・ストレージ・DNSなどが定額パッケージになった、シンプルなVPS型サー ビス。小規模サイト向け。", "tip": "覚え方：Amazon Lightsailの「役割」を一言で言えるようにする。PDF p.2 の比較表とセットで覚える。", "page": 2, "section": "■ 弾力性・拡張性・可用性に関する重要用語"}, {"front": "AWS Batchとは？", "back": "大量のバッチ計算ジョブを、必要なコンピューティングリソースを自動調達して実行す るサービス。", "tip": "覚え方：AWS Batchの「役割」を一言で言えるようにする。PDF p.3 の比較表とセットで覚える。", "page": 3, "section": "サービス名 覚えるポイント"}, {"front": "AWS Outpostsとは？", "back": "AWSのインフラ・サービスをオンプレミス環境に設置できるハードウェア。データを自 社内に置く必要がある場合に使う。", "tip": "覚え方：AWS Outpostsの「役割」を一言で言えるようにする。PDF p.3 の比較表とセットで覚える。", "page": 3, "section": "サービス名 覚えるポイント"}, {"front": "Amazon ECSとは？", "back": "AWS独自のコンテナオーケストレーションサービス（Amazon Elastic Container Service）。Dockerコンテナの実行・管理を行う。", "tip": "覚え方：Amazon ECSの「役割」を一言で言えるようにする。PDF p.3 の比較表とセットで覚える。", "page": 3, "section": "サービス名 覚えるポイント"}, {"front": "Amazon EKSとは？", "back": "Kubernetes（K8s）互換のマネージドコンテナオーケストレーションサービス。", "tip": "覚え方：Amazon EKSの「役割」を一言で言えるようにする。PDF p.3 の比較表とセットで覚える。", "page": 3, "section": "サービス名 覚えるポイント"}, {"front": "AWS Fargateとは？", "back": "ECSやEKSの実行基盤となる、サーバーレスのコンテナ実行エンジン。EC2インスタンス の管理が不要になる。", "tip": "覚え方：AWS Fargateの「役割」を一言で言えるようにする。PDF p.3 の比較表とセットで覚える。", "page": 3, "section": "サービス名 覚えるポイント"}, {"front": "Amazon ECRとは？", "back": "Dockerコンテナイメージを保存・管理するプライベートリポジトリ。", "tip": "覚え方：Amazon ECRの「役割」を一言で言えるようにする。PDF p.3 の比較表とセットで覚える。", "page": 3, "section": "サービス名 覚えるポイント"}, {"front": "EC2 Auto Scalingとは？", "back": "需要の増減に応じて、EC2インスタンスの数を自動的に増減させるサービス。最小・最 大・希望のインスタンス数を設定して使う。", "tip": "覚え方：EC2 Auto Scalingの「役割」を一言で言えるようにする。PDF p.3 の比較表とセットで覚える。", "page": 3, "section": "サービス名 覚えるポイント"}, {"front": "Amazon S3とは？", "back": "インターネット経由でアクセスするオブジェクトストレージ。容量無制限で耐久性が高 い。写真・動画・バックアップ等に利用。", "tip": "覚え方：Amazon S3の「役割」を一言で言えるようにする。PDF p.3 の比較表とセットで覚える。", "page": 3, "section": "サービス名 覚えるポイント"}, {"front": "Amazon EBSとは？", "back": "EC2にアタッチするブロックストレージ（仮想ハードディスク）。1つのEC2インスタン スに直結して使う。", "tip": "覚え方：Amazon EBSの「役割」を一言で言えるようにする。PDF p.3 の比較表とセットで覚える。", "page": 3, "section": "サービス名 覚えるポイント"}, {"front": "Amazon EFSとは？", "back": "複数のEC2から同時にマウントできるマネージドのネットワークファイルシステム（NFS ）。", "tip": "覚え方：Amazon EFSの「役割」を一言で言えるようにする。PDF p.3 の比較表とセットで覚える。", "page": 3, "section": "サービス名 覚えるポイント"}, {"front": "Amazon FSxとは？", "back": "Windows File Server や Lustre など、特定用途に最適化されたマネージドファイルストレージ。", "tip": "覚え方：Amazon FSxの「役割」を一言で言えるようにする。PDF p.3 の比較表とセットで覚える。", "page": 3, "section": "サービス名 覚えるポイント"}, {"front": "【EC2＝自由度が高い仮想サーバー（自分で管理）／Elastic Beanstalk＝EC2等をまとめて自動】この章・項目で覚えるポイントは？", "back": "PDF p.3 のこの項目に記載されている内容を確認する。", "tip": "覚え方：まず章タイトルを見て「何の話か」を思い出してから中身を復習する。", "page": 3, "section": "EC2＝自由度が高い仮想サーバー（自分で管理）／Elastic Beanstalk＝EC2等をまとめて自動"}, {"front": "AWS Storage Gatewayとは？", "back": "オンプレミス環境とS3などのAWSストレージをシームレスに接続するハイブリッドスト レージサービス。", "tip": "覚え方：AWS Storage Gatewayの「役割」を一言で言えるようにする。PDF p.4 の比較表とセットで覚える。", "page": 4, "section": "サービス名 覚えるポイント"}, {"front": "S3 Standardとは？", "back": "高頻度アクセス向けの標準クラス。可用性・耐久性が高く、汎用的な用途に使う。", "tip": "覚え方：S3 Standardの「役割」を一言で言えるようにする。PDF p.4 の比較表とセットで覚える。", "page": 4, "section": "サービス名 覚えるポイント"}, {"front": "S3 Intelligent-Tieringとは？", "back": "アクセス頻度を自動で監視し、最適なコストのクラスへ自動的にデータを移動する。ア クセスパターンが読めない場合に最適。", "tip": "覚え方：S3 Intelligent-Tieringの「役割」を一言で言えるようにする。PDF p.4 の比較表とセットで覚える。", "page": 4, "section": "サービス名 覚えるポイント"}, {"front": "S3 Standard-IAとは？", "back": "低頻度アクセス向け。取り出しは高速だが、Standardより保存コストが安く取り出し費 用がかかる（最低保存期間30日）。", "tip": "覚え方：S3 Standard-IAの「役割」を一言で言えるようにする。PDF p.4 の比較表とセットで覚える。", "page": 4, "section": "サービス名 覚えるポイント"}, {"front": "S3 One Zone-IAとは？", "back": "単一のアベイラビリティーゾーン（AZ）にのみ保存する低頻度アクセス向けクラス。St andard-IAよりさらに安価だが可用性は低い。", "tip": "覚え方：S3 One Zone-IAの「役割」を一言で言えるようにする。PDF p.4 の比較表とセットで覚える。", "page": 4, "section": "サービス名 覚えるポイント"}, {"front": "S3 Glacier Instant Retrievalとは？", "back": "アーカイブ用途向けだが、取り出しはミリ秒単位で即時に可能な低コストクラス。", "tip": "覚え方：S3 Glacier Instant Retrievalの「役割」を一言で言えるようにする。PDF p.4 の比較表とセットで覚える。", "page": 4, "section": "サービス名 覚えるポイント"}, {"front": "S3 Glacier Flexible Retrievalとは？", "back": "数分〜数時間で取り出し可能なアーカイブクラス（旧S3 Glacier）。年数回程度のアクセス向け。", "tip": "覚え方：S3 Glacier Flexible Retrievalの「役割」を一言で言えるようにする。PDF p.4 の比較表とセットで覚える。", "page": 4, "section": "サービス名 覚えるポイント"}, {"front": "S3 Glacier Deep Archiveとは？", "back": "S3の中で最も低コストなクラス。取り出しには12時間以上かかる。長期保管・法定保存 用途向け。", "tip": "覚え方：S3 Glacier Deep Archiveの「役割」を一言で言えるようにする。PDF p.4 の比較表とセットで覚える。", "page": 4, "section": "サービス名 覚えるポイント"}, {"front": "AWS Snowconeとは？", "back": "最も小型のエッジデバイス。数TB程度の少量データの移行や、現地でのデータ収集に使 う。", "tip": "覚え方：AWS Snowconeの「役割」を一言で言えるようにする。PDF p.4 の比較表とセットで覚える。", "page": 4, "section": "サービス名 覚えるポイント"}, {"front": "AWS Snowballとは？", "back": "数十TB単位の大量データをオフラインで物理輸送して移行する専用ストレージデバイス 。", "tip": "覚え方：AWS Snowballの「役割」を一言で言えるようにする。PDF p.4 の比較表とセットで覚える。", "page": 4, "section": "サービス名 覚えるポイント"}, {"front": "AWS Snowmobileとは？", "back": "コンテナトラックで運ぶ超大容量（エクサバイト級）のデータ移行サービス。", "tip": "覚え方：AWS Snowmobileの「役割」を一言で言えるようにする。PDF p.4 の比較表とセットで覚える。", "page": 4, "section": "サービス名 覚えるポイント"}, {"front": "AWS DataSyncとは？", "back": "オンプレミスとAWSストレージ間で、ネットワーク経由でデータを自動的に同期・転送 するサービス。", "tip": "覚え方：AWS DataSyncの「役割」を一言で言えるようにする。PDF p.4 の比較表とセットで覚える。", "page": 4, "section": "サービス名 覚えるポイント"}, {"front": "AWS Transfer Familyとは？", "back": "FTP／SFTP／FTPSプロトコルを使ってS3やEFSにファイル転送するためのマネージドサー ビス。", "tip": "覚え方：AWS Transfer Familyの「役割」を一言で言えるようにする。PDF p.4 の比較表とセットで覚える。", "page": 4, "section": "サービス名 覚えるポイント"}, {"front": "EFS＝ファイル（複数EC2で共有、NFS）とは？", "back": "3つは保存形式で区別する", "tip": "覚え方：EFS＝ファイル（複数EC2で共有、NFS） → 「何をするものか」を一文で思い出す。PDF p.4 を再確認。", "page": 4, "section": "サービス名 覚えるポイント"}, {"front": "アクセス頻度が高いとは？", "back": "安い順：Standard→Intelligent-Tiering→Standard-IA→One", "tip": "覚え方：アクセス頻度が高い → 「何をするものか」を一文で思い出す。PDF p.4 を再確認。", "page": 4, "section": "サービス名 覚えるポイント"}, {"front": "▶ 覚え方 Zone-IAとは？", "back": "Glacier Instant Retrieval→Glacier Flexible Retrieval→Glacier Deep", "tip": "覚え方：▶ 覚え方 Zone-IA → 「何をするものか」を一文で思い出す。PDF p.4 を再確認。", "page": 4, "section": "サービス名 覚えるポイント"}, {"front": "NFSプロトコルとは？", "back": "Linux／Unix系でよく使われるファイル共有プロトコル。Amazon EFSはこのNFSでファイルを共有する。", "tip": "覚え方：NFSプロトコルの「役割」を一言で言えるようにする。PDF p.5 の比較表とセットで覚える。", "page": 5, "section": "サービス名 覚えるポイント"}, {"front": "SMBプロトコルとは？", "back": "Windows環境でよく使われるファイル共有プロトコル。Amazon FSx for Windows File ServerはこのSMBに対応する。", "tip": "覚え方：SMBプロトコルの「役割」を一言で言えるようにする。PDF p.5 の比較表とセットで覚える。", "page": 5, "section": "サービス名 覚えるポイント"}, {"front": "Amazon FSx for Windows File Serverとは？", "back": "Windows Serverの機能（Active Directory連携、SMBアクセス）をそのまま使えるマネージドファイルストレージ。", "tip": "覚え方：Amazon FSx for Windows File Serverの「役割」を一言で言えるようにする。PDF p.5 の比較表とセットで覚える。", "page": 5, "section": "サービス名 覚えるポイント"}, {"front": "バージョニングとは？", "back": "S3バケット内のオブジェクトを上書き・削除しても、過去のバージョンを残しておける 機能。誤削除からの復旧に有効。", "tip": "覚え方：バージョニングの「役割」を一言で言えるようにする。PDF p.5 の比較表とセットで覚える。", "page": 5, "section": "サービス名 覚えるポイント"}, {"front": "ライフサイクル設定とは？", "back": "オブジェクトの経過日数に応じて、自動的に安価なストレージクラスへ移行したり、削 除したりするルールを設定する機能。", "tip": "覚え方：ライフサイクル設定の「役割」を一言で言えるようにする。PDF p.5 の比較表とセットで覚える。", "page": 5, "section": "サービス名 覚えるポイント"}, {"front": "ブロックパブリックアクセスとは？", "back": "バケットやオブジェクトが誤って公開設定にされても、パブリックアクセスを強制的に ブロックするセキュリティ機能。", "tip": "覚え方：ブロックパブリックアクセスの「役割」を一言で言えるようにする。PDF p.5 の比較表とセットで覚える。", "page": 5, "section": "サービス名 覚えるポイント"}, {"front": "AWS Backupとは？", "back": "EBS・RDS・DynamoDB・EFSなど複数のAWSサービスのバックアップを一元的に管理・自動 化するサービス。", "tip": "覚え方：AWS Backupの「役割」を一言で言えるようにする。PDF p.5 の比較表とセットで覚える。", "page": 5, "section": "サービス名 覚えるポイント"}, {"front": "ポイントインタイムリカバリ (PITR)とは？", "back": "DynamoDBやRDS等で、過去35日以内の任意の時点の状態にデータベースを復元できる継 続的バックアップ機能。", "tip": "覚え方：ポイントインタイムリカバリ (PITR)の「役割」を一言で言えるようにする。PDF p.5 の比較表とセットで覚える。", "page": 5, "section": "サービス名 覚えるポイント"}, {"front": "AWS CloudHSMとは？", "back": "専用の物理ハードウェア（HSM）上で暗号鍵を管理する、シングルテナントの暗号化サ ービス。KMSより厳格な鍵管理要件（規制対応等）がある場合に使う。", "tip": "覚え方：AWS CloudHSMの「役割」を一言で言えるようにする。PDF p.5 の比較表とセットで覚える。", "page": 5, "section": "サービス名 覚えるポイント"}, {"front": "Amazon RDSとは？", "back": "MySQL・PostgreSQL・Oracle等、複数エンジンに対応したマネージドリレーショナルデ ータベース。", "tip": "覚え方：Amazon RDSの「役割」を一言で言えるようにする。PDF p.5 の比較表とセットで覚える。", "page": 5, "section": "サービス名 覚えるポイント"}, {"front": "Amazon Auroraとは？", "back": "MySQL／PostgreSQL互換で、RDSより高速・高可用性なAWS独自のリレーショナルDB。", "tip": "覚え方：Amazon Auroraの「役割」を一言で言えるようにする。PDF p.6 の比較表とセットで覚える。", "page": 6, "section": "サービス名 覚えるポイント"}, {"front": "Amazon DynamoDBとは？", "back": "キーバリュー／ドキュメント型のフルマネージドNoSQLデータベース。低レイテンシで 大規模に拡張可能。", "tip": "覚え方：Amazon DynamoDBの「役割」を一言で言えるようにする。PDF p.6 の比較表とセットで覚える。", "page": 6, "section": "サービス名 覚えるポイント"}, {"front": "Amazon ElastiCacheとは？", "back": "Redis／Memcached互換のインメモリキャッシュサービス。DBの前段に置いて高速化する 。", "tip": "覚え方：Amazon ElastiCacheの「役割」を一言で言えるようにする。PDF p.6 の比較表とセットで覚える。", "page": 6, "section": "サービス名 覚えるポイント"}, {"front": "Amazon MemoryDB for Redisとは？", "back": "Redis互換で、キャッシュとしてだけでなく、それ自体を耐久性のある本番用データベ ースとしても使えるインメモリデータベース。", "tip": "覚え方：Amazon MemoryDB for Redisの「役割」を一言で言えるようにする。PDF p.6 の比較表とセットで覚える。", "page": 6, "section": "サービス名 覚えるポイント"}, {"front": "Amazon Redshiftとは？", "back": "大規模データを対象にしたペタバイト級のデータウェアハウス（分析用DB）。", "tip": "覚え方：Amazon Redshiftの「役割」を一言で言えるようにする。PDF p.6 の比較表とセットで覚える。", "page": 6, "section": "サービス名 覚えるポイント"}, {"front": "Amazon DocumentDBとは？", "back": "MongoDB互換のドキュメント指向データベース（JSON形式）。", "tip": "覚え方：Amazon DocumentDBの「役割」を一言で言えるようにする。PDF p.6 の比較表とセットで覚える。", "page": 6, "section": "サービス名 覚えるポイント"}, {"front": "Amazon Neptuneとは？", "back": "ノードとエッジで表現する関係性データを扱うグラフデータベース。", "tip": "覚え方：Amazon Neptuneの「役割」を一言で言えるようにする。PDF p.6 の比較表とセットで覚える。", "page": 6, "section": "サービス名 覚えるポイント"}, {"front": "Amazon Timestreamとは？", "back": "時系列データ（IoTセンサー値など）に特化したデータベース。", "tip": "覚え方：Amazon Timestreamの「役割」を一言で言えるようにする。PDF p.6 の比較表とセットで覚える。", "page": 6, "section": "サービス名 覚えるポイント"}, {"front": "Amazon QLDBとは？", "back": "変更履歴が改ざん不可能な形で記録される台帳（元帳）データベース。", "tip": "覚え方：Amazon QLDBの「役割」を一言で言えるようにする。PDF p.6 の比較表とセットで覚える。", "page": 6, "section": "サービス名 覚えるポイント"}, {"front": "Amazon Keyspacesとは？", "back": "Apache Cassandra互換のマネージドNoSQLデータベース。", "tip": "覚え方：Amazon Keyspacesの「役割」を一言で言えるようにする。PDF p.6 の比較表とセットで覚える。", "page": 6, "section": "サービス名 覚えるポイント"}, {"front": "Amazon VPCとは？", "back": "AWS上に自分専用の仮想ネットワーク空間を構築するサービス。サブネット・ルートテ ーブル等で構成する。", "tip": "覚え方：Amazon VPCの「役割」を一言で言えるようにする。PDF p.6 の比較表とセットで覚える。", "page": 6, "section": "サービス名 覚えるポイント"}, {"front": "Amazon Route 53とは？", "back": "DNS（ドメイン名前解決）サービス。ドメイン登録やヘルスチェック、トラフィックル ーティングも行う。", "tip": "覚え方：Amazon Route 53の「役割」を一言で言えるようにする。PDF p.6 の比較表とセットで覚える。", "page": 6, "section": "サービス名 覚えるポイント"}, {"front": "Amazon CloudFrontとは？", "back": "コンテンツ配信ネットワーク（CDN）。世界中のエッジロケーションでキャッシュし配 信を高速化する。", "tip": "覚え方：Amazon CloudFrontの「役割」を一言で言えるようにする。PDF p.6 の比較表とセットで覚える。", "page": 6, "section": "サービス名 覚えるポイント"}, {"front": "AWS Direct Connectとは？", "back": "オンプレミスとAWS間を専用線で接続するサービス。安定した帯域と低レイテンシが特 徴。", "tip": "覚え方：AWS Direct Connectの「役割」を一言で言えるようにする。PDF p.6 の比較表とセットで覚える。", "page": 6, "section": "サービス名 覚えるポイント"}, {"front": "AWS Site-to-Site VPNとは？", "back": "オンプレミスとAWS間をインターネット経由で暗号化接続するVPNサービス。", "tip": "覚え方：AWS Site-to-Site VPNの「役割」を一言で言えるようにする。PDF p.6 の比較表とセットで覚える。", "page": 6, "section": "サービス名 覚えるポイント"}, {"front": "Amazon API Gatewayとは？", "back": "REST／WebSocket APIの作成・公開・管理・スロットリングを行うマネージドサービス。", "tip": "覚え方：Amazon API Gatewayの「役割」を一言で言えるようにする。PDF p.6 の比較表とセットで覚える。", "page": 6, "section": "サービス名 覚えるポイント"}, {"front": "Elastic Load Balancing (ELB)とは？", "back": "複数のリソースにトラフィックを自動分散する負荷分散サービス（ALB／NLB／GLB／CLB の総称）。", "tip": "覚え方：Elastic Load Balancing (ELB)の「役割」を一言で言えるようにする。PDF p.7 の比較表とセットで覚える。", "page": 7, "section": "サービス名 覚えるポイント"}, {"front": "AWS Transit Gatewayとは？", "back": "複数のVPCやオンプレミス拠点を1つのハブに接続し、ネットワークを一元管理するサー ビス。", "tip": "覚え方：AWS Transit Gatewayの「役割」を一言で言えるようにする。PDF p.7 の比較表とセットで覚える。", "page": 7, "section": "サービス名 覚えるポイント"}, {"front": "AWS Global Acceleratorとは？", "back": "AWSのグローバルネットワークを使い、ユーザーを最も近い・最適なエンドポイントへ 振り分けるサービス。", "tip": "覚え方：AWS Global Acceleratorの「役割」を一言で言えるようにする。PDF p.7 の比較表とセットで覚える。", "page": 7, "section": "サービス名 覚えるポイント"}, {"front": "AWS PrivateLinkとは？", "back": "VPCとAWSサービス間をインターネットを経由せずプライベート接続するサービス。", "tip": "覚え方：AWS PrivateLinkの「役割」を一言で言えるようにする。PDF p.7 の比較表とセットで覚える。", "page": 7, "section": "サービス名 覚えるポイント"}, {"front": "CIDRとは？", "back": "IPアドレスの範囲を「10.0.0.0/16」のように表記する方式。VPCやサブネットの大きさ （使えるIPアドレスの数）を決める。", "tip": "覚え方：CIDRの「役割」を一言で言えるようにする。PDF p.7 の比較表とセットで覚える。", "page": 7, "section": "サービス名 覚えるポイント"}, {"front": "サブネットとは？", "back": "VPCのIPアドレス範囲をさらに分割した、小さなネットワーク区画。AZごとに作成する 。", "tip": "覚え方：サブネットの「役割」を一言で言えるようにする。PDF p.7 の比較表とセットで覚える。", "page": 7, "section": "サービス名 覚えるポイント"}, {"front": "パブリックサブネットとは？", "back": "インターネットゲートウェイへの経路を持ち、インターネットと直接通信できるサブネ ット（Webサーバー等を配置）。", "tip": "覚え方：パブリックサブネットの「役割」を一言で言えるようにする。PDF p.7 の比較表とセットで覚える。", "page": 7, "section": "サービス名 覚えるポイント"}, {"front": "プライベートサブネットとは？", "back": "インターネットゲートウェイへの経路を持たず、外部から直接アクセスできないサブネ ット（DBサーバー等を配置）。", "tip": "覚え方：プライベートサブネットの「役割」を一言で言えるようにする。PDF p.7 の比較表とセットで覚える。", "page": 7, "section": "サービス名 覚えるポイント"}, {"front": "セキュリティグループとは？", "back": "EC2インスタンス単位に設定する仮想ファイアウォール。許可ルールのみ設定でき、戻 りの通信は自動的に許可される（ステートフル）。", "tip": "覚え方：セキュリティグループの「役割」を一言で言えるようにする。PDF p.7 の比較表とセットで覚える。", "page": 7, "section": "サービス名 覚えるポイント"}, {"front": "ネットワークACLとは？", "back": "サブネット単位に設定する仮想ファイアウォール。許可・拒否の両方を設定でき、戻り の通信も明示的に許可が必要（ステートレス）。", "tip": "覚え方：ネットワークACLの「役割」を一言で言えるようにする。PDF p.7 の比較表とセットで覚える。", "page": 7, "section": "サービス名 覚えるポイント"}, {"front": "VPCフローログとは？", "back": "VPC内のネットワークインターフェースを行き来する通信の情報（送信元・宛先・ポー ト等）を記録する機能。トラブルシューティングやセキュリティ分析に使う。", "tip": "覚え方：VPCフローログの「役割」を一言で言えるようにする。PDF p.7 の比較表とセットで覚える。", "page": 7, "section": "サービス名 覚えるポイント"}, {"front": "VPCピアリングとは？", "back": "2つのVPCを1対1で接続し、あたかも同じネットワークであるかのように通信できるよう にする機能。", "tip": "覚え方：VPCピアリングの「役割」を一言で言えるようにする。PDF p.7 の比較表とセットで覚える。", "page": 7, "section": "サービス名 覚えるポイント"}, {"front": "【▶ 違い② VPCピアリング＝1対1のVPC接続／Transit Gateway＝多数のVPC・拠点をハブでまとめて接続】この章・項目で覚えるポイントは？", "back": "PDF p.7 のこの項目に記載されている内容を確認する。", "tip": "覚え方：まず章タイトルを見て「何の話か」を思い出してから中身を復習する。", "page": 7, "section": "▶ 違い② VPCピアリング＝1対1のVPC接続／Transit Gateway＝多数のVPC・拠点をハブでまとめて接続"}, {"front": "AWS IAMとは？", "back": "AWSリソースへのアクセスを「誰が」「何を」できるか制御する、ユーザー・ロール・ ポリシーの管理サービス。", "tip": "覚え方：AWS IAMの「役割」を一言で言えるようにする。PDF p.8 の比較表とセットで覚える。", "page": 8, "section": "サービス名 覚えるポイント"}, {"front": "IAM Identity Centerとは？", "back": "複数のAWSアカウントやアプリケーションへのシングルサインオン（SSO）を提供するサ ービス。", "tip": "覚え方：IAM Identity Centerの「役割」を一言で言えるようにする。PDF p.8 の比較表とセットで覚える。", "page": 8, "section": "サービス名 覚えるポイント"}, {"front": "AWS Organizationsとは？", "back": "複数のAWSアカウントを一元管理し、統合請求やSCP（サービスコントロールポリシー） で権限を制御する。", "tip": "覚え方：AWS Organizationsの「役割」を一言で言えるようにする。PDF p.8 の比較表とセットで覚える。", "page": 8, "section": "サービス名 覚えるポイント"}, {"front": "Amazon Cognitoとは？", "back": "モバイル・Webアプリのエンドユーザー向けに、サインアップ・サインイン・認証機能 を提供するサービス。", "tip": "覚え方：Amazon Cognitoの「役割」を一言で言えるようにする。PDF p.8 の比較表とセットで覚える。", "page": 8, "section": "サービス名 覚えるポイント"}, {"front": "AWS Directory Serviceとは？", "back": "Microsoft Active Directoryと連携・互換のディレクトリサービス。", "tip": "覚え方：AWS Directory Serviceの「役割」を一言で言えるようにする。PDF p.8 の比較表とセットで覚える。", "page": 8, "section": "サービス名 覚えるポイント"}, {"front": "AWS KMSとは？", "back": "暗号化に使う鍵（キー）を作成・管理するサービス。", "tip": "覚え方：AWS KMSの「役割」を一言で言えるようにする。PDF p.8 の比較表とセットで覚える。", "page": 8, "section": "サービス名 覚えるポイント"}, {"front": "AWS Secrets Managerとは？", "back": "DBのパスワードやAPIキーなどの機密情報を安全に保管・自動ローテーションするサー ビス。", "tip": "覚え方：AWS Secrets Managerの「役割」を一言で言えるようにする。PDF p.8 の比較表とセットで覚える。", "page": 8, "section": "サービス名 覚えるポイント"}, {"front": "Amazon Macieとは？", "back": "機械学習でS3内のデータをスキャンし、個人情報(PII)などの機密データを検出するサ ービス。", "tip": "覚え方：Amazon Macieの「役割」を一言で言えるようにする。PDF p.8 の比較表とセットで覚える。", "page": 8, "section": "サービス名 覚えるポイント"}, {"front": "Amazon GuardDutyとは？", "back": "VPCフローログ等を機械学習で分析し、不正アクセスや異常な挙動を検知する脅威検出 サービス。", "tip": "覚え方：Amazon GuardDutyの「役割」を一言で言えるようにする。PDF p.8 の比較表とセットで覚える。", "page": 8, "section": "サービス名 覚えるポイント"}, {"front": "Amazon Inspectorとは？", "back": "EC2・コンテナ・Lambdaを自動スキャンし、既知の脆弱性を検出するサービス。", "tip": "覚え方：Amazon Inspectorの「役割」を一言で言えるようにする。PDF p.8 の比較表とセットで覚える。", "page": 8, "section": "サービス名 覚えるポイント"}, {"front": "AWS WAFとは？", "back": "Webアプリケーションに対するSQLインジェクション等の攻撃を防ぐファイアウォール。", "tip": "覚え方：AWS WAFの「役割」を一言で言えるようにする。PDF p.8 の比較表とセットで覚える。", "page": 8, "section": "サービス名 覚えるポイント"}, {"front": "AWS Shieldとは？", "back": "DDoS攻撃からAWSリソースを保護するサービス（Standardは無料で全アカウントに自動 適用）。", "tip": "覚え方：AWS Shieldの「役割」を一言で言えるようにする。PDF p.8 の比較表とセットで覚える。", "page": 8, "section": "サービス名 覚えるポイント"}, {"front": "AWS Firewall Managerとは？", "back": "複数アカウント・VPCにまたがるWAFやShieldのルールを一元管理するサービス。", "tip": "覚え方：AWS Firewall Managerの「役割」を一言で言えるようにする。PDF p.8 の比較表とセットで覚える。", "page": 8, "section": "サービス名 覚えるポイント"}, {"front": "AWS CloudTrailとは？", "back": "AWSアカウント内のAPI呼び出し履歴（誰が・いつ・何をしたか）を記録する証跡サービ ス。", "tip": "覚え方：AWS CloudTrailの「役割」を一言で言えるようにする。PDF p.8 の比較表とセットで覚える。", "page": 8, "section": "サービス名 覚えるポイント"}, {"front": "AWS Configとは？", "back": "AWSリソースの構成変更履歴を記録し、コンプライアンス違反がないかチェックする。", "tip": "覚え方：AWS Configの「役割」を一言で言えるようにする。PDF p.9 の比較表とセットで覚える。", "page": 9, "section": "サービス名 覚えるポイント"}, {"front": "AWS Audit Managerとは？", "back": "監査対応のための証跡収集を自動化するサービス。", "tip": "覚え方：AWS Audit Managerの「役割」を一言で言えるようにする。PDF p.9 の比較表とセットで覚える。", "page": 9, "section": "サービス名 覚えるポイント"}, {"front": "AWS Security Hubとは？", "back": "複数のセキュリティサービス（GuardDuty・Inspector・Macie等）の検出結果を一元的 に集約・可視化するダッシュボード。", "tip": "覚え方：AWS Security Hubの「役割」を一言で言えるようにする。PDF p.9 の比較表とセットで覚える。", "page": 9, "section": "サービス名 覚えるポイント"}, {"front": "AWS Artifactとは？", "back": "AWSのコンプライアンスレポートや契約書類をオンデマンドで取得できるポータル。", "tip": "覚え方：AWS Artifactの「役割」を一言で言えるようにする。PDF p.9 の比較表とセットで覚える。", "page": 9, "section": "サービス名 覚えるポイント"}, {"front": "AWS Certificate Manager (ACM)とは？", "back": "Webサイトの暗号化通信(HTTPS)に使うSSL/TLS証明書を ス名 覚えるポイント"}, {"front": "【Hub＝各種セキュリティサービスの結果を「まとめて見る」ダッシュボード】この章・項目で覚えるポイントは？", "back": "PDF p.9 のこの項目に記載されている内容を確認する。", "tip": "覚え方：まず章タイトルを見て「何の話か」を思い出してから中身を復習する。", "page": 9, "section": "Hub＝各種セキュリティサービスの結果を「まとめて見る」ダッシュボード"}, {"front": "AWS Systems Managerとは？", "back": "EC2やオンプレミスサーバーの運用（パッチ適用、コマンド実行、パラメータ管理等） を一元化するサービス。", "tip": "覚え方：AWS Systems Managerの「役割」を一言で言えるようにする。PDF p.10 の比較表とセットで覚える。", "page": 10, "section": "CloudWatch＝リソース単体の「状態」を監視／X-Ray＝サービスを跨いだ「リクエストの流れ"}, {"front": "セッションマネージャーとは？", "back": "SSHキーやパスワードなしで、ブラウザ・CLI経由で安全にEC2やオンプレミスサーバー にシェル接続できる機能。", "tip": "覚え方：セッションマネージャーの「役割」を一言で言えるようにする。PDF p.10 の比較表とセットで覚える。", "page": 10, "section": "CloudWatch＝リソース単体の「状態」を監視／X-Ray＝サービスを跨いだ「リクエストの流れ"}, {"front": "パッチマネージャーとは？", "back": "OSやソフトウェアのセキュリティパッチ適用を、スケジュールに沿って自動化する機能 。", "tip": "覚え方：パッチマネージャーの「役割」を一言で言えるようにする。PDF p.10 の比較表とセットで覚える。", "page": 10, "section": "CloudWatch＝リソース単体の「状態」を監視／X-Ray＝サービスを跨いだ「リクエストの流れ"}, {"front": "パラメータストアとは？", "back": "設定値・パスワードなどの文字列データを、階層構造で安全に一元管理できる機能（Se crets Managerより簡易な用途向け）。", "tip": "覚え方：パラメータストアの「役割」を一言で言えるようにする。PDF p.10 の比較表とセットで覚える。", "page": 10, "section": "CloudWatch＝リソース単体の「状態」を監視／X-Ray＝サービスを跨いだ「リクエストの流れ"}, {"front": "AWS CloudShellとは？", "back": "ブラウザから直接使える、AWS CLIがプリインストール済みのマネージド型シェル環境。追加設定なしですぐ使える。", "tip": "覚え方：AWS CloudShellの「役割」を一言で言えるようにする。PDF p.10 の比較表とセットで覚える。", "page": 10, "section": "CloudWatch＝リソース単体の「状態」を監視／X-Ray＝サービスを跨いだ「リクエストの流れ"}, {"front": "AWS Cloud9とは？", "back": "ブラウザ上で使えるクラウドベースの統合開発環境（IDE）。コード記述・実行・デバ ッグができる。", "tip": "覚え方：AWS Cloud9の「役割」を一言で言えるようにする。PDF p.10 の比較表とセットで覚える。", "page": 10, "section": "CloudWatch＝リソース単体の「状態」を監視／X-Ray＝サービスを跨いだ「リクエストの流れ"}, {"front": "AWS CodeCommitとは？", "back": "Gitベースのソースコード管理（バージョン管理）サービス。", "tip": "覚え方：AWS CodeCommitの「役割」を一言で言えるようにする。PDF p.10 の比較表とセットで覚える。", "page": 10, "section": "CloudWatch＝リソース単体の「状態」を監視／X-Ray＝サービスを跨いだ「リクエストの流れ"}, {"front": "AWS CodeBuildとは？", "back": "ソースコードのビルド・テストを自動化するマネージドサービス。", "tip": "覚え方：AWS CodeBuildの「役割」を一言で言えるようにする。PDF p.10 の比較表とセットで覚える。", "page": 10, "section": "CloudWatch＝リソース単体の「状態」を監視／X-Ray＝サービスを跨いだ「リクエストの流れ"}, {"front": "AWS CodeDeployとは？", "back": "EC2・Lambda・オンプレミスサーバーへのアプリケーションデプロイを自動化するサー ビス。", "tip": "覚え方：AWS CodeDeployの「役割」を一言で言えるようにする。PDF p.10 の比較表とセットで覚える。", "page": 10, "section": "CloudWatch＝リソース単体の「状態」を監視／X-Ray＝サービスを跨いだ「リクエストの流れ"}, {"front": "AWS CodeArtifactとは？", "back": "ソフトウェアの依存パッケージ（ライブラリ）を保存・共有できるアーティファクトリ ポジトリ。", "tip": "覚え方：AWS CodeArtifactの「役割」を一言で言えるようにする。PDF p.10 の比較表とセットで覚える。", "page": 10, "section": "CloudWatch＝リソース単体の「状態」を監視／X-Ray＝サービスを跨いだ「リクエストの流れ"}, {"front": "AWS Device Farmとは？", "back": "実機の各種スマートフォン・タブレット上で、アプリの動作テストを自動実行できるサ ービス。", "tip": "覚え方：AWS Device Farmの「役割」を一言で言えるようにする。PDF p.10 の比較表とセットで覚える。", "page": 10, "section": "CloudWatch＝リソース単体の「状態」を監視／X-Ray＝サービスを跨いだ「リクエストの流れ"}, {"front": "CodeCommit（ソース管理）とは？", "back": "CodeBuild（ビルド・テスト）→CodeDeploy（デプロイ）の順で", "tip": "覚え方：CodeCommit（ソース管理） → 「何をするものか」を一文で思い出す。PDF p.10 を再確認。", "page": 10, "section": "CloudWatch＝リソース単体の「状態」を監視／X-Ray＝サービスを跨いだ「リクエストの流れ"}, {"front": "AWS Migration Hubとは？", "back": "複数の移行ツールの進捗状況を一元的に追跡・可視化するダッシュボード。", "tip": "覚え方：AWS Migration Hubの「役割」を一言で言えるようにする。PDF p.11 の比較表とセットで覚える。", "page": 11, "section": "9. 移行関連"}, {"front": "AWS Application Discovery Serviceとは？", "back": "オンプレミス環境のサーバー構成・使用状況を自動的に収集し、移行計画の立案を支援 するサービス（移行「前」の現状調査）。", "tip": "覚え方：AWS Application Discovery Serviceの「役割」を一言で言えるようにする。PDF p.11 の比較表とセットで覚える。", "page": 11, "section": "9. 移行関連"}, {"front": "AWS Application Migration Service (MGN)とは？", "back": "サーバー（物理・仮想）をほぼそのままの構成でAWSへリフト＆シフト移行するサービ ス。", "tip": "覚え方：AWS Application Migration Service (MGN)の「役割」を一言で言えるようにする。PDF p.11 の比較表とセットで覚える。", "page": 11, "section": "9. 移行関連"}, {"front": "AWS Database Migration Service (DMS)とは？", "back": "オンプレミス・他クラウドのデータベースをAWSへ、ダウンタイムを最小限にして移行 するサービス。", "tip": "覚え方：AWS Database Migration Service (DMS)の「役割」を一言で言えるようにする。PDF p.11 の比較表とセットで覚える。", "page": 11, "section": "9. 移行関連"}, {"front": "AWS Schema Conversion Tool (SCT)とは？", "back": "異なるDBエンジン間（例：Oracle→Aurora）でスキーマを自動変換するツール。DMSと 組み合わせて使う。", "tip": "覚え方：AWS Schema Conversion Tool (SCT)の「役割」を一言で言えるようにする。PDF p.11 の比較表とセットで覚える。", "page": 11, "section": "9. 移行関連"}, {"front": "AWS Elastic Disaster Recovery (DRS)とは？", "back": "オンプレミスや他クラウドのサーバーを、障害発生時に素早くAWS上で復旧できるよう にするディザスタリカバリサービス。", "tip": "覚え方：AWS Elastic Disaster Recovery (DRS)の「役割」を一言で言えるようにする。PDF p.11 の比較表とセットで覚える。", "page": 11, "section": "9. 移行関連"}, {"front": "Amazon SQSとは？", "back": "メッセージを一時的に保管するキューイングサービス。送信側と受信側の処理を疎結合 にする（1対1が基本）。", "tip": "覚え方：Amazon SQSの「役割」を一言で言えるようにする。PDF p.11 の比較表とセットで覚える。", "page": 11, "section": "9. 移行関連"}, {"front": "Amazon SNSとは？", "back": "1つのメッセージを複数の購読者（メール・SMS・Lambda等）に同時配信するパブリッシ ュ／サブスクライブ型サービス。", "tip": "覚え方：Amazon SNSの「役割」を一言で言えるようにする。PDF p.11 の比較表とセットで覚える。", "page": 11, "section": "9. 移行関連"}, {"front": "Amazon EventBridgeとは？", "back": "AWSサービスやSaaSからのイベントを検知し、ルールに応じて別のサービスを呼び出す イベントバス。", "tip": "覚え方：Amazon EventBridgeの「役割」を一言で言えるようにする。PDF p.11 の比較表とセットで覚える。", "page": 11, "section": "9. 移行関連"}, {"front": "AWS Step Functionsとは？", "back": "複数のAWSサービスを順序立てて実行するワークフローオーケストレーションサービス 。", "tip": "覚え方：AWS Step Functionsの「役割」を一言で言えるようにする。PDF p.11 の比較表とセットで覚える。", "page": 11, "section": "9. 移行関連"}, {"front": "AWS AppConfigとは？", "back": "アプリケーションの設定値や機能フラグ（Feature Flag）を、安全に段階的にデプロイ・管理するサービス。", "tip": "覚え方：AWS AppConfigの「役割」を一言で言えるようにする。PDF p.11 の比較表とセットで覚える。", "page": 11, "section": "9. 移行関連"}, {"front": "AWS Schema Conversion Tool 異なるDBエンジン間（例とは？", "back": "Oracle→Aurora）でスキーマを自動変換するツール。DMSと", "tip": "覚え方：AWS Schema Conversion Tool 異なるDBエンジン間（例 → 「何をするものか」を一文で思い出す。PDF p.11 を再確認。", "page": 11, "section": "9. 移行関連"}, {"front": "AWS AppSyncとは？", "back": "GraphQL APIをマネージドで構築・運用できるサービス。リアルタイム更新やオフライ ン同期に強い。", "tip": "覚え方：AWS AppSyncの「役割」を一言で言えるようにする。PDF p.12 の比較表とセットで覚える。", "page": 12, "section": "サービス名 覚えるポイント"}, {"front": "REST APIとは？", "back": "リソースごとのURLに対しHTTPメソッド（GET／POST等）でアクセスする、最も一般的な Web API方式。", "tip": "覚え方：REST APIの「役割」を一言で言えるようにする。PDF p.12 の比較表とセットで覚える。", "page": 12, "section": "サービス名 覚えるポイント"}, {"front": "WebSocket APIとは？", "back": "クライアントとサーバー間で双方向・持続的な接続を維持するAPI方式。チャットやリ アルタイム通知向け。", "tip": "覚え方：WebSocket APIの「役割」を一言で言えるようにする。PDF p.12 の比較表とセットで覚える。", "page": 12, "section": "サービス名 覚えるポイント"}, {"front": "GraphQL APIとは？", "back": "必要なデータだけを1回のリクエストでまとめて取得できる、クエリ言語ベースのAPI方 式（AppSyncで提供）。", "tip": "覚え方：GraphQL APIの「役割」を一言で言えるようにする。PDF p.12 の比較表とセットで覚える。", "page": 12, "section": "サービス名 覚えるポイント"}, {"front": "Amazon Athenaとは？", "back": "S3上のデータに対してSQLクエリを直接実行できるサーバーレスの分析サービス。", "tip": "覚え方：Amazon Athenaの「役割」を一言で言えるようにする。PDF p.12 の比較表とセットで覚える。", "page": 12, "section": "サービス名 覚えるポイント"}, {"front": "Amazon EMRとは？", "back": "Hadoop／Sparkなどのビッグデータ処理フレームワークをクラスタで実行するマネージ ドサービス。", "tip": "覚え方：Amazon EMRの「役割」を一言で言えるようにする。PDF p.12 の比較表とセットで覚える。", "page": 12, "section": "サービス名 覚えるポイント"}, {"front": "Amazon Kinesis Data Streamsとは？", "back": "リアルタイムのストリーミングデータを収集・一時保持するKinesisのコア機能。AWSネ イティブなストリーミング基盤。", "tip": "覚え方：Amazon Kinesis Data Streamsの「役割」を一言で言えるようにする。PDF p.12 の比較表とセットで覚える。", "page": 12, "section": "サービス名 覚えるポイント"}, {"front": "Amazon MSK (Managed Streaming for Apache Kafka)とは？", "back": "オープンソースのApache Kafkaをフルマネージドで実行できるサービス。", "tip": "覚え方：Amazon MSK (Managed Streaming for Apache Kafka)の「役割」を一言で言えるようにする。PDF p.12 の比較表とセットで覚える。", "page": 12, "section": "サービス名 覚えるポイント"}, {"front": "Apache Kafkaとは？", "back": "大量のストリーミングデータをリアルタイムに処理する、業界標準のオープンソース分 散メッセージングシステム（AWS以外でも広く使われる技術）。", "tip": "覚え方：Apache Kafkaの「役割」を一言で言えるようにする。PDF p.12 の比較表とセットで覚える。", "page": 12, "section": "サービス名 覚えるポイント"}, {"front": "Amazon OpenSearch Serviceとは？", "back": "全文検索・ログ分析エンジン（旧Amazon Elasticsearch Service）。ベクトル検索にも対応。", "tip": "覚え方：Amazon OpenSearch Serviceの「役割」を一言で言えるようにする。PDF p.12 の比較表とセットで覚える。", "page": 12, "section": "サービス名 覚えるポイント"}, {"front": "Amazon QuickSightとは？", "back": "データを可視化するBI（ビジネスインテリジェンス）ダッシュボードサービス。", "tip": "覚え方：Amazon QuickSightの「役割」を一言で言えるようにする。PDF p.12 の比較表とセットで覚える。", "page": 12, "section": "サービス名 覚えるポイント"}, {"front": "AWS Glueとは？", "back": "サーバーレスのETL（抽出・変換・格納）サービス。データカタログ機能も持つ。", "tip": "覚え方：AWS Glueの「役割」を一言で言えるようにする。PDF p.12 の比較表とセットで覚える。", "page": 12, "section": "サービス名 覚えるポイント"}, {"front": "AWS Lake Formationとは？", "back": "S3上にデータレイクを構築し、アクセス権限を一元管理するサービス。", "tip": "覚え方：AWS Lake Formationの「役割」を一言で言えるようにする。PDF p.12 の比較表とセットで覚える。", "page": 12, "section": "サービス名 覚えるポイント"}, {"front": "AWS Data Exchangeとは？", "back": "サードパーティが提供するデータセットを検索・購読・利用できるデータマーケットプ レイス。", "tip": "覚え方：AWS Data Exchangeの「役割」を一言で言えるようにする。PDF p.12 の比較表とセットで覚える。", "page": 12, "section": "サービス名 覚えるポイント"}, {"front": "【GraphQL API 必要なデータだけを1回のリクエストでまとめて取得できる、クエリ言語ベースのAPI方】この章・項目で覚えるポイントは？", "back": "PDF p.12 のこの項目に記載されている内容を確認する。", "tip": "覚え方：まず章タイトルを見て「何の話か」を思い出してから中身を復習する。", "page": 12, "section": "GraphQL API 必要なデータだけを1回のリクエストでまとめて取得できる、クエリ言語ベースのAPI方"}, {"front": "Amazon Rekognitionとは？", "back": "画像・動画の物体検出、顔検出・顔認証、不適切コンテンツの検出などを行う画像／動 画分析サービス。", "tip": "覚え方：Amazon Rekognitionの「役割」を一言で言えるようにする。PDF p.13 の比較表とセットで覚える。", "page": 13, "section": "Kinesis Data Streams＝AWSネイティブなストリーミング基盤／MSK＝使い慣れたApache Kafka"}, {"front": "Amazon Textractとは？", "back": "画像やPDFなどの文書から、テキスト・表・フォーム項目を構造化データとして抽出す る（OCR＋レイアウト理解）。", "tip": "覚え方：Amazon Textractの「役割」を一言で言えるようにする。PDF p.13 の比較表とセットで覚える。", "page": 13, "section": "Kinesis Data Streams＝AWSネイティブなストリーミング基盤／MSK＝使い慣れたApache Kafka"}, {"front": "Amazon Transcribeとは？", "back": "音声データをテキストに変換する（Speech to Text）サービス。", "tip": "覚え方：Amazon Transcribeの「役割」を一言で言えるようにする。PDF p.13 の比較表とセットで覚える。", "page": 13, "section": "Kinesis Data Streams＝AWSネイティブなストリーミング基盤／MSK＝使い慣れたApache Kafka"}, {"front": "Amazon Pollyとは？", "back": "テキストを自然な音声に変換する（Text to Speech）サービス。", "tip": "覚え方：Amazon Pollyの「役割」を一言で言えるようにする。PDF p.13 の比較表とセットで覚える。", "page": 13, "section": "Kinesis Data Streams＝AWSネイティブなストリーミング基盤／MSK＝使い慣れたApache Kafka"}, {"front": "Amazon Translateとは？", "back": "テキストを別の言語へリアルタイムに翻訳する機械翻訳サービス。", "tip": "覚え方：Amazon Translateの「役割」を一言で言えるようにする。PDF p.13 の比較表とセットで覚える。", "page": 13, "section": "Kinesis Data Streams＝AWSネイティブなストリーミング基盤／MSK＝使い慣れたApache Kafka"}, {"front": "Amazon Comprehendとは？", "back": "自然言語処理(NLP)。感情分析・エンティティ抽出・言語検出など、テキストの「意味 」を分析する。", "tip": "覚え方：Amazon Comprehendの「役割」を一言で言えるようにする。PDF p.13 の比較表とセットで覚える。", "page": 13, "section": "Kinesis Data Streams＝AWSネイティブなストリーミング基盤／MSK＝使い慣れたApache Kafka"}, {"front": "Amazon Lexとは？", "back": "音声／テキストによる会話型インターフェース（チャットボット）を構築するエンジン 。Alexaと同じ技術がベース。", "tip": "覚え方：Amazon Lexの「役割」を一言で言えるようにする。PDF p.13 の比較表とセットで覚える。", "page": 13, "section": "Kinesis Data Streams＝AWSネイティブなストリーミング基盤／MSK＝使い慣れたApache Kafka"}, {"front": "Amazon Kendraとは？", "back": "社内文書やFAQなど大量のドキュメント群を対象に、自然言語の質問で検索できるエン タープライズ検索エンジン。", "tip": "覚え方：Amazon Kendraの「役割」を一言で言えるようにする。PDF p.13 の比較表とセットで覚える。", "page": 13, "section": "Kinesis Data Streams＝AWSネイティブなストリーミング基盤／MSK＝使い慣れたApache Kafka"}, {"front": "Amazon Bedrockとは？", "back": "複数社（Anthropic・Meta・Amazon等）の基盤モデル(FM)をAPI経由で利用できるフルマ ネージドの生成AIサービス。", "tip": "覚え方：Amazon Bedrockの「役割」を一言で言えるようにする。PDF p.13 の比較表とセットで覚える。", "page": 13, "section": "Kinesis Data Streams＝AWSネイティブなストリーミング基盤／MSK＝使い慣れたApache Kafka"}, {"front": "Amazon Qとは？", "back": "AWS純正の生成AIアシスタント。業務ユーザー向けの「Q Business」、開発者向けの「Q Developer」等がある。", "tip": "覚え方：Amazon Qの「役割」を一言で言えるようにする。PDF p.13 の比較表とセットで覚える。", "page": 13, "section": "Kinesis Data Streams＝AWSネイティブなストリーミング基盤／MSK＝使い慣れたApache Kafka"}, {"front": "Amazon SageMakerとは？", "back": "機械学習モデルの構築・学習・デプロイ・運用までを行うEnd-to-Endのフルマネージド 機械学習基盤。", "tip": "覚え方：Amazon SageMakerの「役割」を一言で言えるようにする。PDF p.14 の比較表とセットで覚える。", "page": 14, "section": "サービス名 覚えるポイント"}, {"front": "Amazon SES (Simple Email Service)とは？", "back": "大量のメールを送受信するためのマネージドEメール配信サービス。通知メールやマー ケティングメール送信に使う。", "tip": "覚え方：Amazon SES (Simple Email Service)の「役割」を一言で言えるようにする。PDF p.14 の比較表とセットで覚える。", "page": 14, "section": "サービス名 覚えるポイント"}, {"front": "Amazon WorkSpacesとは？", "back": "クラウド上に仮想デスクトップ（VDI）を提供するサービス。リモートワーク環境の構 築等に使う。", "tip": "覚え方：Amazon WorkSpacesの「役割」を一言で言えるようにする。PDF p.14 の比較表とセットで覚える。", "page": 14, "section": "サービス名 覚えるポイント"}, {"front": "Amazon Connectとは？", "back": "クラウド型のコンタクトセンター（コールセンター）を構築するサービス。", "tip": "覚え方：Amazon Connectの「役割」を一言で言えるようにする。PDF p.14 の比較表とセットで覚える。", "page": 14, "section": "サービス名 覚えるポイント"}, {"front": "AWS IoT Coreとは？", "back": "IoTデバイスをAWSに接続し、デバイスとクラウド間の双方向通信・データ収集を行うマ ネージドサービス。", "tip": "覚え方：AWS IoT Coreの「役割」を一言で言えるようにする。PDF p.14 の比較表とセットで覚える。", "page": 14, "section": "サービス名 覚えるポイント"}, {"front": "AWS IoT Greengrassとは？", "back": "IoTデバイス側（エッジ）でAWSの機能の一部をローカル実行できるようにするソフトウ ェア。オフライン時も処理を継続できる。", "tip": "覚え方：AWS IoT Greengrassの「役割」を一言で言えるようにする。PDF p.14 の比較表とセットで覚える。", "page": 14, "section": "サービス名 覚えるポイント"}, {"front": "AWS Pricing Calculatorとは？", "back": "利用前に、構成に応じた料金の見積もりを行うツール。", "tip": "覚え方：AWS Pricing Calculatorの「役割」を一言で言えるようにする。PDF p.14 の比較表とセットで覚える。", "page": 14, "section": "サービス名 覚えるポイント"}, {"front": "AWS Cost Explorerとは？", "back": "過去のコスト・使用状況をグラフで分析・可視化するツール。", "tip": "覚え方：AWS Cost Explorerの「役割」を一言で言えるようにする。PDF p.14 の比較表とセットで覚える。", "page": 14, "section": "サービス名 覚えるポイント"}, {"front": "AWS Budgetsとは？", "back": "設定した予算のしきい値を超えそうな場合にアラートを出す機能。", "tip": "覚え方：AWS Budgetsの「役割」を一言で言えるようにする。PDF p.14 の比較表とセットで覚える。", "page": 14, "section": "サービス名 覚えるポイント"}, {"front": "AWS Cost and Usage Report (CUR)とは？", "back": "AWS利用状況とコストの、最も詳細な生データを出力するレポート機能。", "tip": "覚え方：AWS Cost and Usage Report (CUR)の「役割」を一言で言えるようにする。PDF p.14 の比較表とセットで覚える。", "page": 14, "section": "サービス名 覚えるポイント"}, {"front": "AWS Billing Conductorとは？", "back": "グループ内の請求を独自のルールで再配分・カスタマイズできる請求管理サービス。", "tip": "覚え方：AWS Billing Conductorの「役割」を一言で言えるようにする。PDF p.14 の比較表とセットで覚える。", "page": 14, "section": "サービス名 覚えるポイント"}, {"front": "コスト配分タグとは？", "back": "リソースに付与したタグ単位でコストを分類・集計できるようにする機能。部門別・プ ロジェクト別のコスト管理に使う。", "tip": "覚え方：コスト配分タグの「役割」を一言で言えるようにする。PDF p.15 の比較表とセットで覚える。", "page": 15, "section": "サービス名 覚えるポイント"}, {"front": "オンデマンドとは？", "back": "使った分だけ課金される、最も柔軟な標準の料金モデル。初期費用や長期契約なし。", "tip": "覚え方：オンデマンドの「役割」を一言で言えるようにする。PDF p.15 の比較表とセットで覚える。", "page": 15, "section": "サービス名 覚えるポイント"}, {"front": "リザーブドインスタンス (RI)とは？", "back": "1年または3年の利用を予約することで、オンデマンドより大幅割引を受けられる料金モ デル。", "tip": "覚え方：リザーブドインスタンス (RI)の「役割」を一言で言えるようにする。PDF p.15 の比較表とセットで覚える。", "page": 15, "section": "サービス名 覚えるポイント"}, {"front": "Compute Savings Plansとは？", "back": "EC2・Fargate・Lambdaを横断して「時間あたりの利用金額」を1〜3年契約することで割 引を受けるモデル。最も柔軟。", "tip": "覚え方：Compute Savings Plansの「役割」を一言で言えるようにする。PDF p.15 の比較表とセットで覚える。", "page": 15, "section": "サービス名 覚えるポイント"}, {"front": "EC2 Instance Savings Plansとは？", "back": "特定のリージョン・インスタンスファミリー内であれば、インスタンスタイプやOSを変 更しても割引が適用されるモデル。Compute Savings Plansより対象は狭いが割引率は高め。", "tip": "覚え方：EC2 Instance Savings Plansの「役割」を一言で言えるようにする。PDF p.15 の比較表とセットで覚える。", "page": 15, "section": "サービス名 覚えるポイント"}, {"front": "スポットインスタンスとは？", "back": "AWSの余剰キャパシティを入札形式で安く使える料金モデル。中断される可能性がある 。", "tip": "覚え方：スポットインスタンスの「役割」を一言で言えるようにする。PDF p.15 の比較表とセットで覚える。", "page": 15, "section": "サービス名 覚えるポイント"}, {"front": "専有ホスト (Dedicated Host)とは？", "back": "物理サーバーを1台丸ごと専有する料金モデル。ライセンスやコンプライアンス要件が ある場合に利用。", "tip": "覚え方：専有ホスト (Dedicated Host)の「役割」を一言で言えるようにする。PDF p.15 の比較表とセットで覚える。", "page": 15, "section": "サービス名 覚えるポイント"}, {"front": "AWS Resource Access Manager (RAM)とは？", "back": "自分のアカウントが持つリソース（サブネット等）を、他のAWSアカウントと安全に共 有するサービス。", "tip": "覚え方：AWS Resource Access Manager (RAM)の「役割」を一言で言えるようにする。PDF p.15 の比較表とセットで覚える。", "page": 15, "section": "サービス名 覚えるポイント"}, {"front": "AWS Resource Groupsとは？", "back": "タグなどの条件に基づいて複数のリソースをグループ化し、まとめて表示・管理できる 機能。", "tip": "覚え方：AWS Resource Groupsの「役割」を一言で言えるようにする。PDF p.15 の比較表とセットで覚える。", "page": 15, "section": "サービス名 覚えるポイント"}, {"front": "AWS License Managerとは？", "back": "自社で保有するソフトウェアライセンスの使用状況を追跡・管理するサービス。", "tip": "覚え方：AWS License Managerの「役割」を一言で言えるようにする。PDF p.15 の比較表とセットで覚える。", "page": 15, "section": "サービス名 覚えるポイント"}, {"front": "【AWS Resource Groups タグなどの条件に基づいて複数のリソースをグループ化し、まとめて表示・管理できる】この章・項目で覚えるポイントは？", "back": "PDF p.15 のこの項目に記載されている内容を確認する。", "tip": "覚え方：まず章タイトルを見て「何の話か」を思い出してから中身を復習する。", "page": 15, "section": "AWS Resource Groups タグなどの条件に基づいて複数のリソースをグループ化し、まとめて表示・管理できる"}, {"front": "ベーシックとは？", "back": "全AWSアカウントに無料で付属。ドキュメント・ホワイトペーパー・コミュニティフォ ーラム、Trusted Advisorの基本項目チェック、請求関連の問い合わせのみ利用可（技 術サポートなし）。", "tip": "覚え方：ベーシックの「役割」を一言で言えるようにする。PDF p.16 の比較表とセットで覚える。", "page": 16, "section": "RAM＝リソースを「他アカウントと共有」する仕組み／Resource"}, {"front": "デベロッパーとは？", "back": "ベーシックに加え、営業時間内のEメールでの技術サポート（1名分の連絡先）。応答目 安は重要度に応じて12〜24時間。個人の検証・開発環境向け。", "tip": "覚え方：デベロッパーの「役割」を一言で言えるようにする。PDF p.16 の比較表とセットで覚える。", "page": 16, "section": "RAM＝リソースを「他アカウントと共有」する仕組み／Resource"}, {"front": "ビジネスとは？", "back": "24時間365日、電話・チャット・メールで技術サポート。緊急時の応答目安は最短1時間 。Trusted Advisorの全項目チェックが利用可能。本番環境で運用する企業向け。", "tip": "覚え方：ビジネスの「役割」を一言で言えるようにする。PDF p.16 の比較表とセットで覚える。", "page": 16, "section": "RAM＝リソースを「他アカウントと共有」する仕組み／Resource"}, {"front": "エンタープライズ On-Rampとは？", "back": "ビジネスの内容に加え、専任のプール型TAM（テクニカルアカウントマネージャー）チ ームが支援。緊急時の応答目安は最短30分。中規模企業向け。", "tip": "覚え方：エンタープライズ On-Rampの「役割」を一言で言えるようにする。PDF p.16 の比較表とセットで覚える。", "page": 16, "section": "RAM＝リソースを「他アカウントと共有」する仕組み／Resource"}, {"front": "エンタープライズとは？", "back": "専任のTAMが1名付き、最重要度の応答目安は最短15分。コンシェルジュチームのサポー トも利用可能。ミッションクリティカルなワークロードを持つ大企業向け。", "tip": "覚え方：エンタープライズの「役割」を一言で言えるようにする。PDF p.16 の比較表とセットで覚える。", "page": 16, "section": "RAM＝リソースを「他アカウントと共有」する仕組み／Resource"}, {"front": "AWS Launch Wizardとは？", "back": "定型的なアプリケーション（SAP、Microsoft SQL Server等）を、ベストプラクティス に沿ってウィザード形式で簡単にデプロイできるサービス。", "tip": "覚え方：AWS Launch Wizardの「役割」を一言で言えるようにする。PDF p.16 の比較表とセットで覚える。", "page": 16, "section": "RAM＝リソースを「他アカウントと共有」する仕組み／Resource"}, {"front": "AWS Prescriptive Guidanceとは？", "back": "AWSが提供する、特定の技術課題に対する実践的な戦略・パターン集（具体的な導入手 順のガイド）。", "tip": "覚え方：AWS Prescriptive Guidanceの「役割」を一言で言えるようにする。PDF p.16 の比較表とセットで覚える。", "page": 16, "section": "RAM＝リソースを「他アカウントと共有」する仕組み／Resource"}, {"front": "AWSプロフェッショナルサービスとは？", "back": "AWSの専門家が、移行や導入プロジェクトを直接支援する有償のコンサルティングサー ビス。", "tip": "覚え方：AWSプロフェッショナルサービスの「役割」を一言で言えるようにする。PDF p.16 の比較表とセットで覚える。", "page": 16, "section": "RAM＝リソースを「他アカウントと共有」する仕組み／Resource"}, {"front": "AWS Managed Services (AMS)とは？", "back": "インフラの日々の運用（監視・パッチ適用等）をAWSに委託できる、運用代行サービス 。", "tip": "覚え方：AWS Managed Services (AMS)の「役割」を一言で言えるようにする。PDF p.16 の比較表とセットで覚える。", "page": 16, "section": "RAM＝リソースを「他アカウントと共有」する仕組み／Resource"}, {"front": "AWS Activateとは？", "back": "スタートアップ向けに、AWSクレジットやトレーニング等の特典を提供する支援プログ ラム。", "tip": "覚え方：AWS Activateの「役割」を一言で言えるようにする。PDF p.16 の比較表とセットで覚える。", "page": 16, "section": "RAM＝リソースを「他アカウントと共有」する仕組み／Resource"}, {"front": "AWS IQとは？", "back": "特定のAWSタスクを代行してくれる、認定を受けた個人やコンサルタントを見つけて依 頼できるプラットフォーム。", "tip": "覚え方：AWS IQの「役割」を一言で言えるようにする。PDF p.16 の比較表とセットで覚える。", "page": 16, "section": "RAM＝リソースを「他アカウントと共有」する仕組み／Resource"}, {"front": "APN (AWS Partner Network)とは？", "back": "AWSと連携するパートナー企業（コンサルティング会社・ソフトウェアベンダー等）の ネットワーク・プログラム。", "tip": "覚え方：APN (AWS Partner Network)の「役割」を一言で言えるようにする。PDF p.16 の比較表とセットで覚える。", "page": 16, "section": "RAM＝リソースを「他アカウントと共有」する仕組み／Resource"}, {"front": "AWS re:Postとは？", "back": "AWSに関する技術的な質問を投稿・回答し合う、コミュニティ主導の無料Q&A;サイト。", "tip": "覚え方：AWS re:Postの「役割」を一言で言えるようにする。PDF p.16 の比較表とセットで覚える。", "page": 16, "section": "RAM＝リソースを「他アカウントと共有」する仕組み／Resource"}, {"front": "【▶ 違い Groups＝リソースを「まとめて表示・管理」する仕組み／License】この章・項目で覚えるポイントは？", "back": "PDF p.16 のこの項目に記載されている内容を確認する。", "tip": "覚え方：まず章タイトルを見て「何の話か」を思い出してから中身を復習する。", "page": 16, "section": "▶ 違い Groups＝リソースを「まとめて表示・管理」する仕組み／License"}, {"front": "応答速度が速い順（＝手厚い順）とは？", "back": "エンタープライズ（最短15分・専任TAM）→On-Ramp（最短", "tip": "覚え方：応答速度が速い順（＝手厚い順） → 「何をするものか」を一文で思い出す。PDF p.16 を再確認。", "page": 16, "section": "▶ 違い Groups＝リソースを「まとめて表示・管理」する仕組み／License"}, {"front": "▶ 違い 30分・TAMチーム）とは？", "back": "ビジネス（最短1時間・24時間365日）→デベロッパー（業務時間内のみ", "tip": "覚え方：▶ 違い 30分・TAMチーム） → 「何をするものか」を一文で思い出す。PDF p.16 を再確認。", "page": 16, "section": "▶ 違い Groups＝リソースを「まとめて表示・管理」する仕組み／License"}, {"front": "）とは？", "back": "ベーシック（技術サポートなし）", "tip": "覚え方：） → 「何をするものか」を一文で思い出す。PDF p.16 を再確認。", "page": 16, "section": "▶ 違い Groups＝リソースを「まとめて表示・管理」する仕組み／License"}, {"front": "AWS reとは？", "back": "Post AWSに関する技術的な質問を投稿・回答し合う、コミュニティ主導の無料Q&A;サイト。", "tip": "覚え方：AWS re → 「何をするものか」を一文で思い出す。PDF p.16 を再確認。", "page": 16, "section": "▶ 違い Groups＝リソースを「まとめて表示・管理」する仕組み／License"}, {"front": "リージョンとは？", "back": "世界各地にある独立したAWSのデータセンター群の地理的なまとまり（例：東京リージ ョン）。", "tip": "覚え方：リージョンの「役割」を一言で言えるようにする。PDF p.17 の比較表とセットで覚える。", "page": 17, "section": "プロフェッショナルサービス＝AWS社員による「コンサルティング」／Managed"}, {"front": "アベイラビリティーゾーン (AZ)とは？", "back": "リージョン内にある、物理的に独立した1つ以上のデータセンター。1リージョンに複数 のAZが存在する。", "tip": "覚え方：アベイラビリティーゾーン (AZ)の「役割」を一言で言えるようにする。PDF p.17 の比較表とセットで覚える。", "page": 17, "section": "プロフェッショナルサービス＝AWS社員による「コンサルティング」／Managed"}, {"front": "エッジロケーションとは？", "back": "CloudFrontなどがコンテンツをキャッシュする、リージョンより多数・世界中に分散し た拠点。", "tip": "覚え方：エッジロケーションの「役割」を一言で言えるようにする。PDF p.17 の比較表とセットで覚える。", "page": 17, "section": "プロフェッショナルサービス＝AWS社員による「コンサルティング」／Managed"}, {"front": "AWS Local Zonesとは？", "back": "リージョンから、大都市など利用者により近い場所にコンピューティング・ストレージ を拡張する拠点。超低レイテンシが必要な用途向け。", "tip": "覚え方：AWS Local Zonesの「役割」を一言で言えるようにする。PDF p.17 の比較表とセットで覚える。", "page": 17, "section": "プロフェッショナルサービス＝AWS社員による「コンサルティング」／Managed"}, {"front": "AWS Wavelengthとは？", "back": "通信キャリアの5Gネットワークの中にAWSインフラを組み込み、モバイル端末からの超 低レイテンシを実現するサービス。", "tip": "覚え方：AWS Wavelengthの「役割」を一言で言えるようにする。PDF p.17 の比較表とセットで覚える。", "page": 17, "section": "プロフェッショナルサービス＝AWS社員による「コンサルティング」／Managed"}, {"front": "AWSの責任（\"of\"the Cloud）とは？", "back": "クラウド「自体」のセキュリティ。物理的な設備、ハードウェア、ネットワークインフ ラ、仮想化基盤の保護を担う。", "tip": "覚え方：AWSの責任（\"of\"the Cloud）の「役割」を一言で言えるようにする。PDF p.17 の比較表とセットで覚える。", "page": 17, "section": "プロフェッショナルサービス＝AWS社員による「コンサルティング」／Managed"}, {"front": "顧客の責任（\"in\" the Cloud）とは？", "back": "クラウド「の中」のセキュリティ。OS・アプリのパッチ適用、データの暗号化、IAM設 定、ネットワーク設定（セキュリティグループ等）を担う。", "tip": "覚え方：顧客の責任（\"in\" the Cloud）の「役割」を一言で言えるようにする。PDF p.17 の比較表とセットで覚える。", "page": 17, "section": "プロフェッショナルサービス＝AWS社員による「コンサルティング」／Managed"}, {"front": "ワーク」／reとは？", "back": "Post＝無料の「コミュニティQ&A;」", "tip": "覚え方：ワーク」／re → 「何をするものか」を一文で思い出す。PDF p.17 を再確認。", "page": 17, "section": "プロフェッショナルサービス＝AWS社員による「コンサルティング」／Managed"}, {"front": "リージョン 世界各地にある独立したAWSのデータセンター群の地理的なまとまり（例とは？", "back": "東京リージ", "tip": "覚え方：リージョン 世界各地にある独立したAWSのデータセンター群の地理的なまとまり（例 → 「何をするものか」を一文で思い出す。PDF p.17 を再確認。", "page": 17, "section": "プロフェッショナルサービス＝AWS社員による「コンサルティング」／Managed"}, {"front": "運用上の優秀性とは？", "back": "システムを運用・監視し、継続的にプロセスや手順を改善する。", "tip": "覚え方：運用上の優秀性の「役割」を一言で言えるようにする。PDF p.18 の比較表とセットで覚える。", "page": 18, "section": "サービス名 覚えるポイント"}, {"front": "セキュリティとは？", "back": "データ・システムを保護し、リスクを評価・軽減する。", "tip": "覚え方：セキュリティの「役割」を一言で言えるようにする。PDF p.18 の比較表とセットで覚える。", "page": 18, "section": "サービス名 覚えるポイント"}, {"front": "信頼性とは？", "back": "障害から復旧し、需要に応じて動的にリソースを調達できるようにする。", "tip": "覚え方：信頼性の「役割」を一言で言えるようにする。PDF p.18 の比較表とセットで覚える。", "page": 18, "section": "サービス名 覚えるポイント"}, {"front": "パフォーマンス効率とは？", "back": "コンピューティングリソースを効率的に使い、需要の変化に対応する。", "tip": "覚え方：パフォーマンス効率の「役割」を一言で言えるようにする。PDF p.18 の比較表とセットで覚える。", "page": 18, "section": "サービス名 覚えるポイント"}, {"front": "コスト最適化とは？", "back": "不要なコストを削減し、最も低い価格でシステムを運用する。", "tip": "覚え方：コスト最適化の「役割」を一言で言えるようにする。PDF p.18 の比較表とセットで覚える。", "page": 18, "section": "サービス名 覚えるポイント"}, {"front": "持続可能性とは？", "back": "環境への影響を最小限に抑えた運用を目指す（2021年に追加された6本目の柱）。", "tip": "覚え方：持続可能性の「役割」を一言で言えるようにする。PDF p.18 の比較表とセットで覚える。", "page": 18, "section": "サービス名 覚えるポイント"}, {"front": "ビジネスとは？", "back": "経営層の視点。クラウド導入の成果とビジネス戦略を結びつける（IT戦略とビジネス戦 略の整合）。", "tip": "覚え方：ビジネスの「役割」を一言で言えるようにする。PDF p.18 の比較表とセットで覚える。", "page": 18, "section": "サービス名 覚えるポイント"}, {"front": "人材とは？", "back": "組織の人材・スキル・文化の変革を管理する（研修、組織構造の見直し等）。", "tip": "覚え方：人材の「役割」を一言で言えるようにする。PDF p.18 の比較表とセットで覚える。", "page": 18, "section": "サービス名 覚えるポイント"}, {"front": "ガバナンスとは？", "back": "ビジネスリスクを管理し、目標達成のためのポリシー・プロセスを整備する。", "tip": "覚え方：ガバナンスの「役割」を一言で言えるようにする。PDF p.18 の比較表とセットで覚える。", "page": 18, "section": "サービス名 覚えるポイント"}, {"front": "プラットフォームとは？", "back": "アプリケーションを実行するための、クラウド上の新しいITプラットフォームを構築・ 運用する。", "tip": "覚え方：プラットフォームの「役割」を一言で言えるようにする。PDF p.18 の比較表とセットで覚える。", "page": 18, "section": "サービス名 覚えるポイント"}, {"front": "セキュリティとは？", "back": "組織のセキュリティ目標に沿って、可視性・監査・自動対応の仕組みを構築する。", "tip": "覚え方：セキュリティの「役割」を一言で言えるようにする。PDF p.18 の比較表とセットで覚える。", "page": 18, "section": "サービス名 覚えるポイント" let deck=[...ALL], index=0, revealed=false, known=new Set();

function filtered(){
 const q=document.getElementById('search').value.trim().toLowerCase();
 const s=document.getElementById('section').value;
 return ALL.filter(c=>(!q || JSON.stringify(c).toLowerCase().includes(q)) && (!s || c.section===s));
}
function currentList(){let f=filtered(); if(!f.length) return ALL; return f;}
function render(){
 const list=currentList(); if(index>=list.length) index=0;
 const c=list[index]; revealed=false;
 document.getElementById('front').textContent=c.front;
 document.getElementById('back').textContent=c.back;
 document.getElementById('tip').textContent=c.tip;
 document.getElementById('meta').textContent=`${c.section} ・ PDF p.${c.page}`;
 document.getElementById('hint').style.display='block';
 document.getElementById('answer').classList.remove('show');
 document.getElementById('progress').textContent=`${index+1} / ${list.length}　　覚えた：${known.size}枚`;
}
function flip(){revealed=!revealed;document.getElementById('answer').classList.toggle('show',revealed);document.getElementById('hint').style.display=revealed?'none':'block'}
function next(e){e&&e.stopPropagation();index=(index+1)%currentList().length;render()}
function prev(e){e&&e.stopPropagation();let l=currentList().length;index=(index-1+l)%l;render()}
function shuffle(e){e&&e.stopPropagation();deck.sort(()=>Math.random()-.5);index=0;render()}
function mark(e){e&&e.stopPropagation();let c=currentList()[index];known.add(c.front);next()}
function again(e){e&&e.stopPropagation();revealed=false;document.getElementById('answer').classList.remove('show');document.getElementById('hint').style.display='block'}
function resetDeck(e){e&&e.stopPropagation();index=0;known.clear();document.getElementById('search').value='';document.getElementById('section').value='';render()}
document.getElementById('search').addEventListener('input',()=>{index=0;render()});
document.getElementById('section').addEventListener('change',()=>{index=0;render()});
render();
</script>
