<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AWS CLF-C02 完全暗記カード</title>
<style>
:root { --bg:#f5f7fb; --card:#fff; --text:#172033; --muted:#687386; --accent:#2563eb; --border:#dbe1ea; }
* { box-sizing:border-box; }
body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif; background:var(--bg); color:var(--text); }
header { position:sticky; top:0; z-index:5; background:rgba(245,247,251,.96); backdrop-filter:blur(8px); padding:14px 14px 10px; border-bottom:1px solid var(--border); }
h1 { font-size:20px; margin:0 0 4px; }
.sub { color:var(--muted); font-size:12px; }
.controls { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px; }
select,input,button { width:100%; border:1px solid var(--border); border-radius:10px; padding:10px 11px; background:#fff; font-size:14px; }
button { cursor:pointer; }
.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
.progress { height:6px; background:#e5e9f0; border-radius:99px; overflow:hidden; margin-top:10px; }
.bar { height:100%; width:0; background:var(--accent); transition:.2s; }
main { max-width:760px; margin:auto; padding:18px 14px 100px; }
.meta { color:var(--muted); font-size:12px; margin-bottom:8px; }
.card { background:var(--card); border:1px solid var(--border); border-radius:18px; min-height:360px; padding:26px 22px; box-shadow:0 8px 25px rgba(20,35,60,.06); display:flex; flex-direction:column; justify-content:center; cursor:pointer; user-select:none; }
.term { font-size:27px; line-height:1.35; font-weight:800; text-align:center; word-break:break-word; }
.hint { text-align:center; color:var(--muted); margin-top:18px; font-size:13px; }
.answer { display:none; margin-top:22px; border-top:1px solid var(--border); padding-top:20px; }
.answer .label { font-size:11px; font-weight:700; color:var(--accent); margin-bottom:7px; }
.answerText { font-size:17px; line-height:1.75; }
.tip { margin-top:15px; padding:13px 14px; background:#eef4ff; border-radius:12px; font-size:14px; line-height:1.65; }
.tip b { color:#1d4ed8; }
.nav { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px; }
.actions { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-top:8px; }
.footer { color:var(--muted); font-size:11px; line-height:1.6; margin-top:18px; }
@media (max-width:520px) { .term { font-size:24px; } .card { min-height:390px; } }
</style>
</head>
<body>
<header>
  <h1>AWS CLF-C02 完全暗記カード</h1>
  <div class="sub">PDF「AWSサービス暗記リスト」全21章・221項目を1枚ずつ正確にカード化。似ているサービスの違いはTipsに掲載。</div>
  <div class="controls">
    <input id="search" placeholder="サービス名・用語を検索">
    <select id="section"></select>
  </div>
  <div class="controls">
    <button id="shuffle">🔀 シャッフル</button>
    <button id="reset">↩ 最初から</button>
  </div>
  <div class="progress"><div class="bar" id="bar"></div></div>
</header>

<main>
  <div class="meta" id="meta"></div>
  <div class="card" id="card">
    <div class="term" id="term"></div>
    <div class="hint" id="hint">タップすると解答＋覚え方が表示されます</div>
    <div class="answer" id="answer">
      <div class="label">解答</div>
      <div class="answerText" id="answerText"></div>
      <div class="tip"><b>💡 覚え方・Tips</b><div id="tipText"></div></div>
    </div>
  </div>
  <div class="nav">
    <button id="prev">← 前へ</button>
    <button id="next" class="primary">次へ →</button>
  </div>
  <div class="actions">
    <button id="show">解答を表示</button>
    <button id="known">覚えた ✓</button>
    <button id="again">もう一度</button>
  </div>
  <div class="footer">
    全 <span id="count"></span> 枚。元PDFの掲載内容をベースに作成しています。<br>
    「覚えた」はこのブラウザ内だけで記録します。検索・章選択・シャッフルに対応。
  </div>
</main>

<script src="cards.js"></script>
<script>
let deck = [...allCards];
let index = 0;
let revealed = false;
let known = new Set();

const $ = id => document.getElementById(id);
const sectionEl = $("section");
const searchEl = $("search");

const sections = [...new Set(allCards.map(c => c.section))];
sectionEl.innerHTML = '<option value="">すべての章</option>' + sections.map(s => `<option>${escapeHtml(s)}</option>`).join("");

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}

function rebuild() {
  const q = searchEl.value.trim().toLowerCase();
  const sec = sectionEl.value;
  deck = allCards.filter(c =>
    (!q || (c.term + " " + c.answer + " " + c.tip).toLowerCase().includes(q)) &&
    (!sec || c.section === sec)
  );
  index = 0;
  revealed = false;
  render();
}

function render() {
  $("count").textContent = deck.length;
  if (!deck.length) {
    $("term").textContent = "該当するカードがありません";
    $("hint").textContent = "検索条件を変えてください";
    $("answer").style.display = "none";
    $("meta").textContent = "";
    $("bar").style.width = "0%";
    return;
  }
  const c = deck[index];
  $("meta").textContent = `${index+1} / ${deck.length}　｜　${c.section}　｜　PDF p.${c.page}`;
  $("term").textContent = c.term;
  $("answerText").textContent = c.answer;
  $("tipText").textContent = c.tip;
  $("answer").style.display = revealed ? "block" : "none";
  $("hint").style.display = revealed ? "none" : "block";
  $("bar").style.width = `${((index+1)/deck.length)*100}%`;
}

function move(delta) {
  if (!deck.length) return;
  index = (index + delta + deck.length) % deck.length;
  revealed = false;
  render();
  window.scrollTo({top:0,behavior:"smooth"});
}

$("card").addEventListener("click", () => {
  if (!deck.length) return;
  revealed = !revealed;
  render();
});
$("show").addEventListener("click", () => { revealed = true; render(); });
$("again").addEventListener("click", () => { revealed = false; render(); });
$("known").addEventListener("click", () => {
  if (!deck.length) return;
  known.add(deck[index].term + "|" + deck[index].page);
  move(1);
});
$("prev").addEventListener("click", () => move(-1));
$("next").addEventListener("click", () => move(1));
$("shuffle").addEventListener("click", () => {
  for (let i=deck.length-1;i>0;i--) {
    const j=Math.floor(Math.random()*(i+1));
    [deck[i],deck[j]]=[deck[j],deck[i]];
  }
  index=0; revealed=false; render();
});
$("reset").addEventListener("click", () => { index=0; revealed=false; render(); });
searchEl.addEventListener("input", rebuild);
sectionEl.addEventListener("change", rebuild);

render();
</script>
</body>
</html>
